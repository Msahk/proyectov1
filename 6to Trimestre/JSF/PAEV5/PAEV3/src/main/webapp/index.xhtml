<!DOCTYPE html>
<html  xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">
<h:head>
    <meta charset="UTF-8"/>
    <title>Péguele a la Empanada</title>
    <link rel="stylesheet" type="text/css" href="assets/css/index.css"/>
</h:head>
<h:body>
    <header class="header">
        <div class="logo">Péguele a la Empanada 🥟</div>
        <nav class="navbar">
            <a href="#inicio">Inicio</a>
            <a class="boton" onclick="login()">Ingresar</a>
        </nav>
    </header>
    
    <main>
        <section class="inicio" id="inicio">
            <div class="contenido">
                <h1>¡Bienvenido al sistema!</h1>
                <p>Optimiza tus procesos, organiza tu inventario y controla tus operaciones.</p>
                <a onclick="login()" class="boton">Ingresar al sistema</a>
            </div>
            <div class="imagenes">
                <img src="#{request.contextPath}/assets/img/1.png" alt="Empanada tradicional"/>
                <img src="#{request.contextPath}/assets/img/2.png" alt="Empanada de queso"/>
                <img src="#{request.contextPath}/assets/img/4.png" alt="Empanada picante"/>
            </div>
        </section>
    </main>

    
    <footer class="footer">
        <p> 2025 Péguelo a la Empanada. Todos los derechos reservados.</p>
    </footer>

<div id="login-placeholder" style="display:none">
  <h:form id="formLogin" prependId="false">
    <p:messages id="msj" />
    <p:outputLabel for="correoDoc" value="Correo o Documento:"  style="display:block; margin-bottom:6px; font-weight:600;"/>
    <p:inputText id="correoDoc" value="#{usuariosBean.usuario.correo}" style="width:100%;"/>
    <p:outputLabel for="PwUsr" value="Contraseña:" style="display:block; margin-bottom:6px; font-weight:600;"/>
    <p:password id="PwUsr" value="#{usuariosBean.usuario.password}" style="width:100%;"  />
    <p:commandButton id="btnLogin" value="Aceptar"
                     action="#{usuariosBean.autenticar}"
                     update="msj"
                     oncomplete="handleLoginComplete(xhr, status, args)"
                     ajax="true" style="margin-top: 20px;" />
  </h:form>
</div>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<script type="text/javascript">
  /*<![CDATA[*/
  window.login = function () {
    Swal.fire({
      html: '<div id="swal-login-container"></div>',
      title: "Iniciar Sesión",
      showConfirmButton: false,
      showCloseButton: true,
      didOpen: function () {
        var container = document.getElementById('swal-login-container');
        var form = document.getElementById('formLogin');
        if (!form) {
          console.warn('formLogin no encontrado en el DOM');
          return;
        }
        container.appendChild(form);
        form.style.display = 'block';
      },
      willClose: function () {
        var placeholder = document.getElementById('login-placeholder');
        var form = document.getElementById('formLogin');
        if (form && placeholder) {
          placeholder.appendChild(form);
          form.style.display = 'none';
        }
      }
    });
  };

  function handleLoginComplete(xhr, status, args) {
  var logged = args && args.loggedIn;
  var msg = args && args.msg ? args.msg : 'Credenciales inválidas';

  if (logged) {
    Swal.fire({ icon: 'success', title: 'Bienvenido', text: msg, timer: 1200, showConfirmButton: false })
      .then(function () {
        window.location = args.redirect || 'Dashboard.xhtml';
      });
  } else {
    Swal.fire({ icon: 'error', title: 'Error', text: msg }).then(function () {
      try {
        var correo = args && args.correoPreserve ? args.correoPreserve : '';
        var correoEl = document.getElementById('correoDoc');
        if (correoEl) correoEl.value = correo;
        var pwEl = document.getElementById('PwUsr');
        if (pwEl) pwEl.value = '';
      } catch (e) { console.warn(e); }
    });
  }
}


  /*]]>*/
</script>
