<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets">  
<h:head>
    <title>Dashboard</title>
    <!-- Bootstrap desde CDN -->
    <link rel="stylesheet" 
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" />
</h:head>
<h:body class="bg-light">

    <!-- Incluir la navbar -->
    <ui:include src="Navbar.xhtml" />

    <div class="container mt-5">
        <div class="card shadow p-4">
            <h2 class="text-center">Bienvenido al Dashboard</h2>
            <hr/>
            <h4>
                Hola, 
                <strong>#{usuariosBean.usuario.nombres} #{usuariosBean.usuario.apellidos}</strong>
            </h4>
            <p>
                Rol: 
                <strong>
                    <h:outputText value="#{usuariosBean.usuario.rol eq 'A' ? 'Administrador' : 
                                            (usuariosBean.usuario.rol eq 'EP' ? 'Empleado Producción' : 
                                            (usuariosBean.usuario.rol eq 'EV' ? 'Empleado Ventas' : 'Desconocido'))}" />
                </strong>
            </p>
        </div>
    </div>

</h:body>
</html>
