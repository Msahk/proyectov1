<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets">

<h:head>
    <title>Nueva Venta</title>
    
    <link rel="stylesheet" 
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" />
</h:head>
<h:body class="bg-light">

   
     <ui:include src="/views/Navbar.xhtml" />

    <div class="container mt-5">
        <div class="card shadow p-4">
            <h2 class="text-center">Registrar Nueva Venta</h2>
            <hr/>

            <h:form>
                <h:panelGrid columns="2" cellpadding="5" class="table table-borderless">
                    <h:outputLabel value="Tipo:" styleClass="form-label" />
                    <h:selectOneMenu value="#{ventasBean.ventaNueva.tipo}" styleClass="form-select">
                        <f:selectItem itemValue="directa" itemLabel="Directa" />
                        <f:selectItem itemValue="pedido" itemLabel="Pedido" />
                    </h:selectOneMenu>

                    <h:outputLabel value="Cliente (ID):" styleClass="form-label" />
                    <h:inputText value="#{ventasBean.ventaNueva.idCliente}" styleClass="form-control" />

                    <h:outputLabel value="Usuario (ID):" styleClass="form-label" />
                    <h:inputText value="#{ventasBean.ventaNueva.idUsuario}" styleClass="form-control" />

                    <h:outputLabel value="Total:" styleClass="form-label" />
                    <h:inputText value="#{ventasBean.ventaNueva.total}" styleClass="form-control" />

                    <h:outputLabel value="Estado:" styleClass="form-label" />
                    <h:selectOneMenu value="#{ventasBean.ventaNueva.estado}" styleClass="form-select">
                        <f:selectItem itemValue="Procesando" itemLabel="Procesando" />
                        <f:selectItem itemValue="Completada" itemLabel="Completada" />
                    </h:selectOneMenu>

                    <h:outputLabel value="Observaciones:" styleClass="form-label" />
                    <h:inputTextarea value="#{ventasBean.ventaNueva.observaciones}" rows="3" cols="30" styleClass="form-control"/>
                </h:panelGrid>

                <div class="mt-4 text-center">
                   <h:commandButton value="Guardar" styleClass="btn btn-success" action="#{ventasBean.guardarVenta}" />
                   <h:commandButton value="Volver" styleClass="btn btn-secondary ms-3" action="#{ventasBean.volverALaLista}" />
                </div>
            </h:form>
        </div>
    </div>

</h:body>
</html>
