<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core">

<h:head>
    <title>Listado de Ventas</title>
</h:head>
<h:body>

    <h1>Listado de Ventas</h1>

    <h:form>
        <h:commandButton value="Nueva Venta" action="nuevaVenta.xhtml?faces-redirect=true" />
    </h:form>

    <h:form>
        <h:dataTable value="#{ventasBean.listaVentas}" var="v" border="1" cellpadding="5">

            <h:column>
                <f:facet name="header">ID</f:facet>
                #{v.idVen}
            </h:column>

            <h:column>
                <f:facet name="header">Tipo</f:facet>
                #{v.tipo}
            </h:column>

            <h:column>
                <f:facet name="header">Cliente</f:facet>
                #{v.idCliente}
            </h:column>

            <h:column>
                <f:facet name="header">Usuario</f:facet>
                #{v.idUsuario}
            </h:column>

            <h:column>
                <f:facet name="header">Total</f:facet>
                #{v.total}
            </h:column>

            <h:column>
                <f:facet name="header">Estado</f:facet>
                #{v.estado}
            </h:column>

            <h:column>
                <h:commandButton value="Editar" 
                                 action="editarVenta.xhtml?faces-redirect=true">
                    <f:setPropertyActionListener target="#{ventasBean.ventaSeleccionada}" value="#{v}" />
                </h:commandButton>
            </h:column>

            <h:column>
                <h:commandButton value="Eliminar" action="#{ventasBean.eliminarVenta(v.idVen)}" />
            </h:column>
        </h:dataTable>
    </h:form>

</h:body>
</html>
