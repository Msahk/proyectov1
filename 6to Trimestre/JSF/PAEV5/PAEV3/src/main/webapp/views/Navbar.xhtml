<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">
<h:head>
    <title>Dashboard</title>
    <h:outputStylesheet library="primefaces" name="primefaces.css"/>
    <h:outputStylesheet library="css" name="tablas.css"/>
    <h:outputStylesheet library="css" name="navbar.css"/>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&amp;display=swap"
      rel="stylesheet"/>
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" 
          rel="stylesheet" />
    
</h:head>
    <h:body>
    <header class="header">
        <div class="logo">Peguele a la empanada</div>
    
        <h:form>
        <p:menubar styleClass="navbar">
           <p:submenu label="Administración" rendered="#{not empty sessionScope.sessionUser and sessionScope.sessionUser.rol == 'A'}">


                <p:menuitem value="Usuarios" outcome="/views/Usuarios/Index.xhtml"/>
                <p:menuitem value="Ventas" outcome="/views/Ventas/index.xhtml"/>
                <p:menuitem value="Pedidos" outcome="/views/Pedidos/Index.xhtml"/>
                <p:menuitem value="Inventario"/>
                <p:menuitem value="Producción"/>
            </p:submenu>

            <p:submenu label="Administración" rendered="#{not empty sessionScope.sessionUser and sessionScope.sessionUser.rol == 'EP'}">


                <p:menuitem value="Inventario"/>
                <p:menuitem value="Producción"/>
            </p:submenu>

            <p:submenu label="Administración" rendered="#{not empty sessionScope.sessionUser and sessionScope.sessionUser.rol == 'EV'}">


                <p:menuitem value="Ventas"/>
                <p:menuitem value="Pedidos"/>
            </p:submenu>

            <p:menuitem value="Cerrar Sesión" action="#{usuariosBean.logout}" ajax="false" icon="pi pi-sign-out"/>


        </p:menubar>
    </h:form>
        </header>
</h:body>
</html>
