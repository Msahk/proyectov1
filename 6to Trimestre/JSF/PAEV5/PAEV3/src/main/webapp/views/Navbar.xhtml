<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">
<h:head>
    <title>Dashboard</title>
</h:head>
<h:body>

    <h:form>
        <p:menubar>
            <p:submenu label="Administración" rendered="#{usuariosBean.usuario.rol eq 'A'}">
                <p:menuitem value="Usuarios" outcome="/views/Usuarios/Index.xhtml"/>
                <p:menuitem value="Ventas" outcome="/views/Ventas/index.xhtml"/>
                <p:menuitem value="Pedidos"/>
                <p:menuitem value="Inventario"/>
                <p:menuitem value="Producción"/>
            </p:submenu>

            <p:submenu label="Producción" rendered="#{usuariosBean.usuario.rol eq 'EP'}">
                <p:menuitem value="Inventario"/>
                <p:menuitem value="Producción"/>
            </p:submenu>

            <p:submenu label="Ventas" rendered="#{usuariosBean.usuario.rol eq 'EV'}">
                <p:menuitem value="Ventas"/>
                <p:menuitem value="Pedidos"/>
            </p:submenu>

            <p:menuitem value="Cerrar Sesión" action="#{usuariosBean.logout}" ajax="false" icon="pi pi-sign-out"/>
        </p:menubar>
    </h:form>
</h:body>
</html>
