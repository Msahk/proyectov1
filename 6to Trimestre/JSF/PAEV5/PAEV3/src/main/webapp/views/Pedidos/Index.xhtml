<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets">
<h:head>
    <title>Gestión de Pedidos</title>
    <link rel="stylesheet" 
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" />
</h:head>
<h:body class="bg-light">

    <ui:include src="/views/Navbar.xhtml" />

    <div class="container mt-5">
        <div class="card shadow p-4">
            <h2 class="text-center">Gestión de Pedidos</h2>
            

           
          

            <hr/>

            <h:form>
                <h:dataTable value="#{pedidosBean.listaPedidos}" var="pedido" border="1" cellpadding="5" class="table table-bordered">
                    <h:column>
                        <f:facet name="header">ID Pedido</f:facet>
                        #{pedido.idPed}
                    </h:column>
                    <h:column>
                        <f:facet name="header">ID Venta</f:facet>
                        #{pedido.idVen}
                    </h:column>
                    <h:column>
                        <f:facet name="header">Fecha Entrega</f:facet>
                        #{pedido.fechaEntrega}
                    </h:column>
                    <h:column>
                        <f:facet name="header">Estado</f:facet>
                        #{pedido.estado}
                    </h:column>
                    <h:column>
                        <f:facet name="header">Observaciones</f:facet>
                        #{pedido.observacionesPedido}
                    </h:column>
                    <h:column>
                        <h:commandButton value="Editar" 
                                        
                                         action="#{pedidosBean.prepararEdicion(pedido)}" />
                    </h:column>
                    <h:column>
                        <h:commandButton value="Eliminar"
                                        
                                         action="#{pedidosBean.eliminarPedido(pedido.idPed)}"
                                         onclick="return confirm('¿Está segur@ de ELIMINAR el pedido?')" />
                    </h:column>
                </h:dataTable>
            </h:form>

            <h:form>
                <h:commandButton value="Nuevo Pedido" styleClass="btn btn-primary mt-3" action="nuevoPedido.xhtml?faces-redirect=true" />
            </h:form>
        </div>
    </div>

</h:body>
</html>
