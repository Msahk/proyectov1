<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">
    <h:head>
        <style>
            *{
                font-family: Arial;
            }
            h1{
                color: blue;
                text-align: center;
            }
        </style>
        <title>Primer Ejemplo JSF</title>
    </h:head>
    <h:body>
        <h1>Ingreso de Usuarios</h1>
        <center>
            <h:form>
                <p:outputLabel value="Correo: "/>
                <p:inputText required="true" id="correo" value="#{usuariosBean.usuarios.correo}"
                             requiredMessage=" Debe escribir el correo" 
                             validatorMessage=" Mínimo 3 y máximo 10 caracteres" >
                </p:inputText>
                
                <p:message for="IdUsr" style="color: red;" />
                <br/><br/>
                
                <p:outputLabel value="Contraseña: "/>                
                <p:password required="true" id="PwUsr" value="#{usuariosBean.usuarios.password}"
                               requiredMessage=" Debe escribir la Contraseña" 
                               validatorMessage=" Una Mayúscula, una minúscula, un número (4 a 10 caracteres)">                    
                    <f:validateRegex pattern="" />
                </p:password>
                <p:message for="PwUsr" style="color: red;" />
                <br/><br/>
                
                <p:commandButton value="Aceptar" actionListener="#{usuariosBean.autenticar()}" />
                <br/><br/>
                <p:commandLink value="Olvidé mi Contraseña"  style="margin-right: 15px;"/>
                <p:commandLink value="Regístrate AQUI" />
            </h:form>            
        </center>  
        <p:messages id="msj" showSummary="true" showDetail="false"  />
    </h:body>
</html>
