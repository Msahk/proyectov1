<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets">

<h:head>
    <title>Editar Venta</title>
    
    <link rel="stylesheet" 
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" />
</h:head>
<h:body class="bg-light">

  
     <ui:include src="/views/Navbar.xhtml" />

    <div class="container mt-5">
        <div class="card shadow p-4">
            <h2 class="text-center">Editar Venta</h2>
            <hr/>

            <h:form>
                <h:messages globalOnly="true" layout="table" styleClass="alert alert-warning"/>

                <h:panelGrid columns="2" cellpadding="5" class="table table-borderless">
                    <h:outputLabel value="Tipo:" styleClass="form-label" />
                    <h:selectOneMenu value="#{ventasBean.ventaSeleccionada.tipo}" styleClass="form-select">
                        <f:selectItem itemValue="directa" itemLabel="Directa" />
                        <f:selectItem itemValue="pedido" itemLabel="Pedido" />
                    </h:selectOneMenu>

                    <h:outputLabel value="Cliente:" styleClass="form-label" />
                    <h:inputText value="#{ventasBean.ventaSeleccionada.idCliente}" styleClass="form-control" />

                    <h:outputLabel value="Usuario:" styleClass="form-label" />
                    <h:inputText value="#{ventasBean.ventaSeleccionada.idUsuario}" styleClass="form-control" />

                    <h:outputLabel value="Total:" styleClass="form-label" />
                    <h:inputText value="#{ventasBean.ventaSeleccionada.total}" styleClass="form-control" />

                    <h:outputLabel value="Estado:" styleClass="form-label" />
                    <h:selectOneMenu value="#{ventasBean.ventaSeleccionada.estado}" styleClass="form-select">
                        <f:selectItem itemValue="Procesando" itemLabel="Procesando" />
                        <f:selectItem itemValue="Completada" itemLabel="Completada" />
                    </h:selectOneMenu>

                    <h:outputLabel value="Observaciones:" styleClass="form-label" />
                    <h:inputText value="#{ventasBean.ventaSeleccionada.observaciones}" styleClass="form-control" />
                </h:panelGrid>

                <div class="mt-4 text-center">
                    <h:commandButton value="Actualizar" styleClass="btn btn-primary" action="#{ventasBean.actualizarVenta}" />
                    <h:commandButton value="Volver" styleClass="btn btn-secondary ms-3" action="#{ventasBean.volverALaLista}" />
                </div>
            </h:form>
        </div>
    </div>

</h:body>
</html>
