<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html">

<h:head>
    <title>Editar Venta</title>
</h:head>
<h:body>

    <h1>Editar Venta</h1>

    <h:form>
        <h:panelGrid columns="2" cellpadding="5">

            <h:outputLabel value="ID:" />
            <h:inputText value="#{ventasBean.ventaSeleccionada.idVen}" readonly="true" />

            <h:outputLabel value="Tipo:" />
            <h:inputText value="#{ventasBean.ventaSeleccionada.tipo}" />

            <h:outputLabel value="Cliente:" />
            <h:inputText value="#{ventasBean.ventaSeleccionada.idCliente}" />

            <h:outputLabel value="Usuario:" />
            <h:inputText value="#{ventasBean.ventaSeleccionada.idUsuario}" />

            <h:outputLabel value="Total:" />
            <h:inputText value="#{ventasBean.ventaSeleccionada.total}" />

            <h:outputLabel value="Estado:" />
            <h:inputText value="#{ventasBean.ventaSeleccionada.estado}" />

            <h:outputLabel value="Observaciones:" />
            <h:inputTextarea value="#{ventasBean.ventaSeleccionada.observaciones}" rows="3" cols="30"/>
        </h:panelGrid>

        <h:commandButton value="Actualizar" action="#{ventasBean.actualizarVenta}" />
        <h:commandButton value="Volver" action="ventas.xhtml?faces-redirect=true" />
    </h:form>

</h:body>
</html>
