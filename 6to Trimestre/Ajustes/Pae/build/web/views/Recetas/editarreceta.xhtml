<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" 
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets">

<h:head>
    <title>Editar Receta</title>
    <h:outputStylesheet library="css" name="bootstrap.min.css"/>
</h:head>

<h:body style="background-color:#f8f9fa;">
    <ui:include src="/views/Navbar.xhtml" />
    <!-- No limpiar aquí porque perderías los datos cargados -->
    <p:growl id="msj" showDetail="true" showSummary="true" />

    <div class="container mt-5">
        <div class="card shadow p-4">
            <div class="card-header bg-primary text-white mb-4">
                <h2 class="text-center mb-0">Editar Receta</h2>
            </div>

            <h:form id="formEditarReceta">

                <div class="form-row">
                    <div class="form-group col-md-6">
                        <label for="nombre">Nombre:</label>
                        <p:inputText id="nombre" value="#{recetasBean.receta.nombre}" required="true"
                                     requiredMessage="Debe ingresar el nombre de la receta"
                                     styleClass="form-control"/>
                        <p:message for="nombre" style="color:red;" />
                    </div>

                    <div class="form-group col-md-6">
                        <label for="estado">Estado:</label>
                        <h:selectOneMenu id="estado" value="#{recetasBean.receta.estado}" required="true"
                                         requiredMessage="Debe seleccionar el estado" styleClass="form-control">
                            <f:selectItem itemLabel="Activo" itemValue="Activo"/>
                            <f:selectItem itemLabel="Inactivo" itemValue="Inactivo"/>
                        </h:selectOneMenu>
                        <p:message for="estado" style="color:red;" />
                    </div>
                </div>

                <div class="form-row mt-3">
                    <div class="form-group col-md-12">
                        <label for="descripcion">Descripción:</label>
                        <p:inputTextarea id="descripcion" value="#{recetasBean.receta.descripcion}" 
                                         styleClass="form-control" rows="4" autoResize="false"/>
                        <p:message for="descripcion" style="color:red;" />
                    </div>
                </div>

                <div class="text-center mt-4">
    <!-- Botón Actualizar -->
    <p:commandButton value="Actualizar" ajax="false" 
                     action="#{recetasBean.guardarYRedirigir}" 
                     styleClass="btn btn-success mx-2"/>

    <!-- Botón Cancelar -->
    <p:commandButton value="Cancelar" ajax="false" immediate="true" 
                     action="/Recetas/recetas.xhtml?faces-redirect=true" 
                     styleClass="btn btn-secondary mx-2"/>
</div>

            </h:form>
        </div>
    </div>
</h:body>
</html>
