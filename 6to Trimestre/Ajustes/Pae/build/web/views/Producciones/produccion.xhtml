<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets">

<h:head>
    <title>Gestión de Producciones</title>
    <h:outputStylesheet library="css" name="bootstrap.min.css"/>
</h:head>

<h:body styleClass="body">
    <ui:include src="/views/Navbar.xhtml" />

    <f:event type="preRenderView" listener="#{produccionBean.listar}" />
    <p:growl id="msj" showDetail="true" showSummary="true" />

    <center>
        <div class="container mt-5" style="max-width: 1600px">
            <div class="card shadow p-3">
                <h1 class="mb-4">Gestión de Producciones</h1>

                <!-- BOTONES SUPERIORES CENTRADOS -->
                <h:form id="formBotones">
                    <div class="d-flex justify-content-center mb-4" style="gap: 10px;">
                      <p:commandButton value="Nueva Producción"
                 icon="pi pi-plus"
                 styleClass="btn btn-primary"
                 ajax="false"
                 action="nuevaproduccion?faces-redirect=true"/>


                        <p:commandButton value="Exportar Excel" icon="pi pi-file-excel"
                                         styleClass="btn btn-success"
                                         actionListener="#{produccionBean.exportarExcel}" />

                        <p:commandButton value="Generar PDF" icon="pi pi-file-pdf"
                                         styleClass="btn btn-danger"
                                         actionListener="#{produccionBean.generarReportePDF}" />
                    </div>
                </h:form>

                <!-- TABLA DE PRODUCCIONES -->
                <h:form id="formTablaProducciones">
                    <p:dataTable id="tablaProducciones" value="#{produccionBean.lstProduccion}" var="prod"
                                 class="table table-bordered" widgetVar="wtProduccion"
                                 rows="10" paginator="true"
                                 filteredValue="#{produccionBean.lstProduccionFiltrados}"
                                 emptyMessage="No se encontraron producciones"
                                 paginatorTemplate="{CurrentPageReport} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}"
                                 currentPageReportTemplate="{startRecord}-{endRecord} de {totalRecords} registros"
                                 rowsPerPageTemplate="10,20,50" filterEvent="keyup">

                        <!-- FILTRO GLOBAL -->
                        <f:facet name="header">
                            <div class="d-flex justify-content-end mb-2">
                                <p:inputText id="globalFilter" onkeyup="PF('wtProduccion').filter()"
                                             style="width:12rem" placeholder="Buscar..." />
                            </div>
                        </f:facet>

                        <!-- COLUMNAS -->
                        <p:column filterBy="#{prod.id_proc}" sortBy="#{prod.id_proc}" width="60">
                            <f:facet name="header">ID</f:facet>
                            <p:outputLabel value="#{prod.id_proc}" />
                        </p:column>

                        <p:column filterBy="#{prod.fecha_produccion}" sortBy="#{prod.fecha_produccion}">
                            <f:facet name="header">Fecha Producción</f:facet>
                            <p:outputLabel value="#{prod.fecha_produccion}">
                                <f:convertDateTime pattern="dd/MM/yyyy" />
                            </p:outputLabel>
                        </p:column>

                        <p:column filterBy="#{prod.usuario}" sortBy="#{prod.usuario}">
                            <f:facet name="header">Usuario</f:facet>
                            <p:outputLabel value="#{prod.usuario}" />
                        </p:column>

                        <p:column filterBy="#{prod.fecha_hora}" sortBy="#{prod.fecha_hora}">
                            <f:facet name="header">Fecha Hora</f:facet>
                            <p:outputLabel value="#{prod.fecha_hora}">
                                <f:convertDateTime pattern="dd/MM/yyyy HH:mm:ss" />
                            </p:outputLabel>
                        </p:column>

                        <p:column filterBy="#{prod.estado}" sortBy="#{prod.estado}" width="120">
                            <f:facet name="header">Estado</f:facet>
                            <p:outputLabel value="#{prod.estado eq 'Pendiente' ? 'Pendiente' : 'Completada'}"
                                           style="font-weight:bold; color:#{prod.estado eq 'Pendiente' ? 'orange' : 'green'};" />
                        </p:column>

                        <!-- OPCIONES -->
                        <p:column style="width:15rem">
                            <f:facet name="header">Opciones</f:facet>
                            <div class="d-flex justify-content-center" style="gap:5px;">
                                <!-- Editar -->
                                <p:commandButton icon="pi pi-pencil" title="Editar"
                                                 styleClass="btn btn-outline-success btn-sm"
                                                 action="editarproduccion.xhtml?faces-redirect=true"
                                                 actionListener="#{produccionBean.editar(prod)}" />

                                <!-- Gestionar Recetas -->
                                <p:commandButton icon="pi pi-list" title="Gestionar Recetas"
                                                 styleClass="btn btn-outline-primary btn-sm"
                                                 action="produccion_recetas.xhtml?faces-redirect=true"
                                                 actionListener="#{produccionBean.editar(prod)}" />

                                <!-- Finalizar Producción -->
                                <p:commandButton icon="pi pi-check" title="Finalizar Producción"
                                                 styleClass="btn btn-outline-success btn-sm"
                                                 onclick="return confirm('¿Desea finalizar esta producción? Esto descontará los insumos.');"
                                                 actionListener="#{produccionBean.cambiarEstado(prod,'Completada')}" 
                                                 update="@form" 
                                                 rendered="#{prod.estado eq 'Pendiente'}" />

                                <!-- Eliminar -->
                                <p:commandButton icon="pi pi-trash" title="Eliminar"
                                                 styleClass="btn btn-outline-danger btn-sm"
                                                 onclick="return confirm('¿Está seguro de eliminar esta producción?');"
                                                 actionListener="#{produccionBean.eliminar(prod)}" 
                                                 update="@form" />
                            </div>
                        </p:column>

                    </p:dataTable>

                    <br/>
                    <!-- BOTÓN REGRESAR AL MENÚ -->
                    <p:commandButton value="Menú anterior" icon="pi pi-home" 
                                     styleClass="btn btn-secondary"
                                     action="/views/Dashboard.xhtml?faces-redirect=true" />
                </h:form>
            </div>
        </div>
    </center>
</h:body>
</html>
