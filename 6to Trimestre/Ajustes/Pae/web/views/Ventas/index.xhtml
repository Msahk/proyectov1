<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets">
    <h:head>
        <title>Gestión de Ventas</title>
        <link rel="stylesheet" 
              href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" />
    </h:head>
    <h:body class="body">
        <f:event type="preRenderView" listener="#{ventasBean.cargarVentas()}" />

        <ui:include src="/views/Navbar.xhtml" />
        <center>
            <div class="container mt-5" style="max-width: 1600px">
                <div class="card shadow p-3">
                    <h1>Gestión de Ventas</h1>
                    <h:form id="filtroVentasForm">
                        
                        <h:commandButton value="Reporte PDF"  style="margin-left: 10px" styleClass="btn btn-primary" actionListener="#{ventasBean.exportarPDF}"/>
                        <h:commandButton value="Nueva Venta" style="margin-left: 10px" styleClass="btn btn-primary" action="nuevaVenta.xhtml?faces-redirect=true" />
                        <h:commandButton value="Gestionar Clientes" style="margin-left: 10px" action="/views/Clientes/Index.xhtml?faces-redirect=true" styleClass="btn btn-primary" />
                         <h:commandButton/>
                        <h:commandButton value="Migrar"
    action="/views/Ventas/migrarVentas.xhtml?faces-redirect=true"
    styleClass="btn btn-primary" />
                        
                        <br/><br/>
                        <p:dataTable value="#{ventasBean.listaVentas}" var="venta" class="table table-bordered"
             widgetVar="wtVentas"
             emptyMessage="No se encontraron Registros en la Base de Datos" rows="5"
             paginator="true" paginatorPosition="bottom"
             filteredValue="#{ventasBean.listaVentasFiltradas}"
             paginatorTemplate="{CurrentPageReport} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}"
             currentPageReportTemplate="{startRecord}-{endRecord} de {totalRecords} registros"
             rowsPerPageTemplate="5,10,{ShowAll|'Todos'}"
             filterEvent="keyup">
    <f:facet name="header">
        <div align="right">
            <p:inputText id="globalFilter" onkeyup="PF('wtVentas').filter()" style="width:10rem"
                         placeholder="Buscar ..." />
        </div>
    </f:facet>
    <p:column filterBy="#{venta.idVen}" filterMatchMode="contains" sortBy="#{venta.idVen}">
        <f:facet name="header">ID</f:facet>
        <p:outputLabel value="#{venta.idVen}" />    
    </p:column>
    <p:column filterBy="#{venta.tipo}" filterMatchMode="contains" sortBy="#{venta.tipo}">
        <f:facet name="header">Tipo</f:facet>
        <p:outputLabel value="#{venta.tipo}" />
    </p:column>
    <p:column filterBy="#{venta.nombreCliente}" filterMatchMode="contains" sortBy="#{venta.nombreCliente}">
        <f:facet name="header">Cliente</f:facet>
        <p:outputLabel value="#{venta.nombreCliente}" />
    </p:column>
    <p:column filterBy="#{venta.nombreUsuario}" filterMatchMode="contains" sortBy="#{venta.nombreUsuario}">
        <f:facet name="header">Usuario</f:facet>
        <p:outputLabel value="#{venta.nombreUsuario}" />
    </p:column>
    <p:column filterBy="#{venta.total}" filterMatchMode="contains" sortBy="#{venta.total}">
        <f:facet name="header">Total</f:facet>
        <p:outputLabel value="#{venta.total}" />
    </p:column>
    <p:column filterBy="#{venta.estado}" filterMatchMode="contains" sortBy="#{venta.estado}">
        <f:facet name="header">Estado</f:facet>
        <p:outputLabel value="#{venta.estado}" />
    </p:column>
    <p:column filterBy="#{venta.observaciones}" filterMatchMode="contains" sortBy="#{venta.observaciones}">
        <f:facet name="header">Observaciones</f:facet>
        <p:outputLabel value="#{venta.observaciones}" />
    </p:column>
    <p:column>
        <f:facet name="header">Opciones</f:facet>
        
        <h:commandLink action="editarVentas" actionListener="#{ventasBean.prepararEdicion(venta)}" styleClass="btn btn-outline-warning d-inline-flex align-items-center">
            <i class="bi bi-pencil" aria-hidden="true"></i>
        </h:commandLink>
        <h:commandLink onclick="return confirm('¿Está seguro de ELIMINAR la venta?!!')"
                       actionListener="#{ventasBean.eliminarVenta(venta.idVen)}"
                       styleClass="btn btn-outline-danger d-inline-flex align-items-center">
            <i class="bi bi-trash" aria-hidden="true"></i>
        </h:commandLink>
        
        <h:link title="Ver detalle"
        value=""
        outcome="/views/Ventas/gestionarrecetas.xhtml">
    <f:param name="idVenta" value="#{venta.idVen}" />
    <i class="bi bi-eye" aria-hidden="true"></i>
</h:link>

        
    </p:column>
</p:dataTable>
                    </h:form>
                   
                    <p:dialog id="detalleDialog" widgetVar="detalleDialog" modal="true" header="Detalle de Venta" resizable="false" width="500">
    <p:dataTable value="#{ventasBean.detallesVentaActual}" var="det" styleClass="table table-bordered text-center" emptyMessage="No hay empanadas asociadas">
        <p:column headerText="Empanada / Receta">
            <h:outputText value="#{det.nombreEmpanada}" />
        </p:column>
        <p:column headerText="Cantidad">
            <h:outputText value="#{det.cantidad}" />
        </p:column>
    </p:dataTable>
</p:dialog>
                    <br/>
                    <h:form>
                        <p:commandButton 
                            value="Menu anterior" icon="pi pi-home" action="/views/Dashboard.xhtml?faces-redirect=true" />
                    </h:form>
                </div>
            </div>
        </center>
    </h:body>
</html>
