<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" 
                      "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets">

<h:head>
    <title>Nuevo Insumo</title>
    <h:outputStylesheet library="css" name="bootstrap.min.css"/>
</h:head>

<h:body style="background-color:#f8f9fa;">
    <ui:include src="/views/Navbar.xhtml" />
    <f:event type="preRenderView" listener="#{insumosBean.limpiar()}" />

    <div class="container mt-5">
        <div class="card shadow p-4">
            <div class="card-header bg-primary text-white mb-4">
                <h2 class="text-center mb-0">Registrar Nuevo Insumo</h2>
            </div>

            <h:form id="formNuevoInsumo" enctype="multipart/form-data">

                <div class="form-row">
                    <div class="form-group col-md-6">
                        <label for="nombre">Nombre:</label>
                        <p:inputText id="nombre" value="#{insumosBean.insumo.nombre}" required="true"
                                     requiredMessage="Debe ingresar el nombre del insumo"
                                     styleClass="form-control"/>
                        <p:message for="nombre" style="color:red;" />
                    </div>

                    <div class="form-group col-md-6">
                        <label for="unidad">Unidad de Medida:</label>
                        <p:inputText id="unidad" value="#{insumosBean.insumo.unidad_medida}" required="true"
                                     requiredMessage="Debe ingresar la unidad de medida" styleClass="form-control"/>
                        <p:message for="unidad" style="color:red;" />
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group col-md-4">
                        <label for="cantidad">Cantidad:</label>
                        <p:inputText id="cantidad" value="#{insumosBean.insumo.cantidad}" required="true"
                                     requiredMessage="Debe ingresar la cantidad" styleClass="form-control"/>
                        <p:message for="cantidad" style="color:red;" />
                    </div>

                    <div class="form-group col-md-4">
                        <label for="stockMin">Stock Mínimo:</label>
                        <p:inputText id="stockMin" value="#{insumosBean.insumo.stock_min}" required="true"
                                     requiredMessage="Debe ingresar el stock mínimo" styleClass="form-control"/>
                        <p:message for="stockMin" style="color:red;" />
                    </div>

                    <div class="form-group col-md-4">
                        <label for="stockActual">Stock Actual:</label>
                        <p:inputText id="stockActual" value="#{insumosBean.insumo.stock_actual}" required="true"
                                     requiredMessage="Debe ingresar el stock actual" styleClass="form-control"/>
                        <p:message for="stockActual" style="color:red;" />
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group col-md-6">
                        <label for="fechaVenc">Fecha de Vencimiento:</label>
                        <p:calendar id="fechaVenc" value="#{insumosBean.insumo.fecha_vencimiento}" 
                                    pattern="dd/MM/yyyy" required="true" 
                                    requiredMessage="Debe seleccionar una fecha" styleClass="form-control"/>
                        <p:message for="fechaVenc" style="color:red;" />
                    </div>

                    <div class="form-group col-md-6">
                        <label for="estado">Estado:</label>
                        <h:selectOneMenu id="estado" value="#{insumosBean.insumo.estado}" required="true"
                                         requiredMessage="Debe seleccionar el estado" styleClass="form-control">
                            <f:selectItem itemLabel="Activo" itemValue="Activo"/>
                            <f:selectItem itemLabel="Inactivo" itemValue="Inactivo"/>
                        </h:selectOneMenu>
                        <p:message for="estado" style="color:red;" />
                    </div>
                </div>

                <div class="text-center mt-4">
                    <p:commandButton value="Guardar" ajax="false" 
                                     actionListener="#{insumosBean.agregar()}" 
                                     action="insumos" styleClass="btn btn-success mx-2"/>
                    <p:commandButton value="Cancelar" ajax="false" immediate="true" 
                                     action="insumos" styleClass="btn btn-secondary mx-2"/>
                </div>

            </h:form>
        </div>
    </div>
</h:body>
</html>
