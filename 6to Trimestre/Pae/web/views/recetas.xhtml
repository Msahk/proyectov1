<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:p="http://primefaces.org/ui">

    <h:head>
        <meta charset="UTF-8" />
        <title>Gestión de Recetas</title>
        <link rel="stylesheet" href="#{request.contextPath}/assets/css/inventario.css" />
    </h:head>

    <h:body>
        <div class="container">
            <h:button outcome="/views/produccion" value="⬅️ Regresar" styleClass="btn btn-secondary"/>
            <div class="page-header">
                <h1>Gestión de Recetas</h1>
                <p>Agrega, edita o elimina recetas, y gestiona los insumos de cada una.</p>
            </div>

            <!-- Barra de acciones -->
            <div class="actions-bar">
                <p:commandButton value="➕ Nueva Receta" 
                                 onclick="PF('dlgNuevo').show()" 
                                 type="button" 
                                 styleClass="btn btn-success" />
            </div>

            <!-- Tabla de recetas -->
           <h:form id="formTabla">
    <p:dataTable id="tablaRecetas"
                 value="#{recetasBean.listaRecetas}"
                 var="r"
                 paginator="true"
                 rows="10"
                 style="width:100%;">

        <p:column headerText="ID" style="width:60px; text-align:center;">
            <h:outputText value="#{r.id_rec}" />
        </p:column>

        <p:column headerText="Nombre">
            <h:outputText value="#{r.nombre}" />
        </p:column>

        <p:column headerText="Descripción">
            <h:outputText value="#{r.descripcion}" />
        </p:column>

        <p:column headerText="Acciones" style="text-align:center; width:250px;">

            <!-- Botón Gestionar Insumos -->
            <p:commandButton value="Insumos" icon="pi pi-list"
                             styleClass="btn btn-primary"
                             actionListener="#{recetaInsumosBean.setIdReceta(r.id_rec)}"
                             update=":dlgInsumosForm"
                             oncomplete="PF('dlgInsumos').show()" />

            <!-- Botón Editar -->
            <p:commandButton value="✏️" title="Editar"
                             actionListener="#{recetasBean.prepararEdicion(r)}"
                             update=":formEditar"
                             oncomplete="PF('dlgEditar').show()" />

            <!-- Botón visible para SweetAlert2 -->
            <p:commandButton value="🗑️" title="Eliminar"
                             onclick="confirmDeletePF('#{r.id_rec}'); return false;"
                             styleClass="btn btn-danger" />

            
            
            <p:commandButton id="btnEliminar#{r.id_rec}"
                 widgetVar="btnEliminar#{r.id_rec}"
                 actionListener="#{recetasBean.eliminarRecetaPorId(r.id_rec)}"
                 update=":formTabla:tablaRecetas"
                 style="display:none" />

        </p:column>

    </p:dataTable>
</h:form>


        </div>

        
        <!-- Dialogo Insumos -->
<p:dialog id="dlgInsumos" header="Gestión de Insumos" widgetVar="dlgInsumos"
          modal="true" width="700" height="500" resizable="false">
    <h:form id="dlgInsumosForm">
        <ui:include src="receta_insumos.xhtml"/>
    </h:form>
</p:dialog>
        <!-- Dialogo Nueva Receta -->
        <p:dialog id="dlgNuevo" widgetVar="dlgNuevo" header="Nueva Receta" modal="true" resizable="false">
            <h:form id="formNuevo">
                <p:panelGrid columns="2" styleClass="form-group" columnClasses="label,value" style="gap:0.5rem;">
                    <h:outputLabel value="Nombre:" for="nombre" />
                    <p:inputText id="nombre" value="#{recetasBean.receta.nombre}" required="true" />

                    <h:outputLabel value="Descripción:" for="descripcion" />
                    <p:inputText id="descripcion" value="#{recetasBean.receta.descripcion}" required="true" />
                </p:panelGrid>


                <p:commandButton value="Guardar"
                                 action="#{recetasBean.agregarReceta}"
                                 update=":formTabla"
                                 oncomplete="PF('dlgNuevo').hide()" />
            </h:form>
        </p:dialog>

        <!-- Dialogo Editar Receta -->
        <p:dialog id="dlgEditar" widgetVar="dlgEditar" header="Editar Receta" modal="true" resizable="false">
            <h:form id="formEditar">
                <p:panelGrid columns="2" styleClass="form-group" columnClasses="label,value" style="gap:0.5rem;">
                    <h:outputLabel value="Nombre:" for="editarNombre" />
                    <p:inputText id="editarNombre" value="#{recetasBean.receta.nombre}" required="true" />

                    <h:outputLabel value="Descripción:" for="editarDescripcion" />
                    <p:inputText id="editarDescripcion" value="#{recetasBean.receta.descripcion}" required="true" />
                </p:panelGrid>


                <p:commandButton value="Actualizar"
                                 action="#{recetasBean.editarReceta}"
                                 update=":formTabla,formEditar"
                                 oncomplete="PF('dlgEditar').hide()" />
            </h:form>
        </p:dialog>

        <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
        <script>
                         function confirmDeletePF(id) {
                             Swal.fire({
                                 title: '¿Eliminar receta?',
                                 text: "Esta acción no se puede deshacer",
                                 icon: 'warning',
                                 showCancelButton: true,
                                 confirmButtonColor: '#d32f2f',
                                 cancelButtonColor: '#9e9e9e',
                                 confirmButtonText: 'Sí, eliminar',
                                 cancelButtonText: 'Cancelar'
                             }).then((result) => {
                                 if (result.isConfirmed) {
                                     PF('btnEliminar' + id).jq.click(); // dispara el botón oculto
                                 }
                             });
                         }

        </script>

        <footer class="footer">
            <p>copy; 2025 Péguele a la Empanada. Sistema de Producción.</p>
        </footer>
    </h:body>
</html>
