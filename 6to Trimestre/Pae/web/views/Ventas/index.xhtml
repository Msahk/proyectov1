<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets">
    <h:head>
        <title>Gestión de Ventas</title>

        <link rel="stylesheet" 
              href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" />
    </h:head>
    <h:body class="body">
        <f:event type="preRenderView" listener="#{ventasBean.cargarVentas()}" />

        <ui:include src="/views/Navbar.xhtml" />
        <center>
            <div class="container mt-5" style="max-width: 1600px">
                <div class="card shadow p-3">
                    <h1>Gestión de Ventas</h1>
                    <h:form id="filtroVentasForm">
                        <h:commandButton value="Reporte PDF"  style="margin-left: 10px" styleClass="btn btn-primary" actionListener="#{ventasBean.exportarPDF}"/>
                        <h:commandButton value="Nueva Venta" style="margin-left: 10px" styleClass="btn btn-primary" action="nuevaVenta.xhtml?faces-redirect=true" />
                        <h:commandButton value="Gestionar Clientes" style="margin-left: 10px" action="/views/Clientes/Index.xhtml?faces-redirect=true" styleClass="btn btn-primary" />
                        

                        <br/><br/>

                        <p:dataTable value="#{ventasBean.listaVentas}" var="venta">
                            <p:column>
                                <f:facet name="header">ID</f:facet>
                                    #{venta.idVen}
                            </p:column>

                            <p:column>
                                <f:facet name="header">Tipo</f:facet>
                                    #{venta.tipo}
                            </p:column>

                            <p:column>
                                <f:facet name="header">Cliente</f:facet>
                                    #{venta.nombreCliente}
                            </p:column>
                            <p:column>
                                <f:facet name="header">Usuario</f:facet>
                                    #{venta.nombreUsuario}
                            </p:column>

                            <p:column>
                                <f:facet name="header">Total</f:facet>
                                    #{venta.total}
                            </p:column>

                            <p:column>
                                <f:facet name="header">Estado</f:facet>
                                    #{venta.estado}
                            </p:column>

                            <p:column>
                                <f:facet name="header">Observaciones</f:facet>
                                    #{venta.observaciones}
                            </p:column>

                            <p:column>
                                <f:facet name="header">Opciones</f:facet>
                                <h:commandLink action="editarVentas" actionListener="#{ventasBean.prepararEdicion(venta)}" styleClass="btn btn-outline-warning d-inline-flex align-items-center">
                                    <i class="bi bi-pencil" aria-hidden="true"></i>
                                </h:commandLink>

                                <h:commandLink onclick="return confirm('¿Está seguro de ELIMINAR la venta?!!')" actionListener="#{ventasBean.eliminarVenta(venta.idVen)}"
                                               styleClass="btn btn-outline-danger d-inline-flex align-items-center">
                                    <i class="bi bi-trash" aria-hidden="true"></i>
                                </h:commandLink>
                            </p:column>
                        </p:dataTable>
                        <br/>
                        <p:commandButton 
                            value="Menu anterior" icon="pi pi-home" action="/views/Dashboard.xhtml?faces-redirect=true" />
                    </h:form>
                </div>
            </div>
        </center>
    </h:body>
</html>
