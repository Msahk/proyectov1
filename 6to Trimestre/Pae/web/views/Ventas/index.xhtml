<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets">
<h:head>
    <title>Gestión de Ventas</title>
    
    <link rel="stylesheet" 
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" />
</h:head>
<h:body class="bg-light">

    
     <ui:include src="/views/Navbar.xhtml" />
<div class="container mt-5">
        <div class="card shadow p-4">
            <h2 class="text-center">Gestión de Ventas</h2>
            

           
          

            <hr/>
    <div class="container  mt-5">
        <div class="card shadow p-4">
     <h:form id="filtroVentasForm">
    <h:panelGrid columns="10" cellpadding="5" class="table table-borderless">
        <h:outputLabel value="ID Venta:" />
        <h:inputText value="#{ventasBean.filtroIdVenta}" styleClass="form-control" />

        <h:outputLabel value="Tipo:" />
        <h:selectOneMenu value="#{ventasBean.filtroTipo}" styleClass="form-select">
            <f:selectItem itemValue="" itemLabel="Todos" />
            <f:selectItem itemValue="directa" itemLabel="Directa" />
            <f:selectItem itemValue="pedido" itemLabel="Pedido" />
        </h:selectOneMenu>

        <h:outputLabel value="Cliente:" />
        <h:inputText value="#{ventasBean.filtroCliente}" styleClass="form-control"/>

        <h:outputLabel value="Usuario:" />
        <h:inputText value="#{ventasBean.filtroUsuario}" styleClass="form-control"/>

        <h:outputLabel value="Total mínimo:" />
        <h:inputText value="#{ventasBean.filtroTotalMin}" styleClass="form-control" />

        <h:outputLabel value="Total máximo:" />
        <h:inputText value="#{ventasBean.filtroTotalMax}" styleClass="form-control" />

        <h:outputLabel value="Estado:" />
        <h:selectOneMenu value="#{ventasBean.filtroEstado}" styleClass="form-select">
            <f:selectItem itemValue="" itemLabel="Todos" />
            <f:selectItem itemValue="Procesando" itemLabel="Procesando" />
            <f:selectItem itemValue="Completada" itemLabel="Completada" />
        </h:selectOneMenu>

        <h:outputLabel value="Fecha desde:" />
        <p:calendar value="#{ventasBean.filtroFechaDesde}" pattern="yyyy-MM-dd" showButtonPanel="true" navigator="true" locale="es" />

        <h:outputLabel value="Fecha hasta:" />
        <p:calendar value="#{ventasBean.filtroFechaHasta}" pattern="yyyy-MM-dd" showButtonPanel="true" navigator="true" locale="es" />

        <h:commandButton value="Filtrar" action="#{ventasBean.filtrarVentas}" styleClass="btn btn-primary" />
    </h:panelGrid>
</h:form>
            <h:form>
                <h:dataTable value="#{ventasBean.listaVentas}" var="venta" border="1" cellpadding="5" class="table table-bordered">
                    <h:column>
                        <f:facet name="header">ID</f:facet>
                        #{venta.idVen}
                    </h:column>

                    <h:column>
                        <f:facet name="header">Tipo</f:facet>
                        #{venta.tipo}
                    </h:column>

                   <h:column>
    <f:facet name="header">Cliente</f:facet>
    #{venta.nombreCliente}
</h:column>
<h:column>
    <f:facet name="header">Usuario</f:facet>
    #{venta.nombreUsuario}
</h:column>

                    <h:column>
                        <f:facet name="header">Total</f:facet>
                        #{venta.total}
                    </h:column>

                    <h:column>
                        <f:facet name="header">Estado</f:facet>
                        #{venta.estado}
                    </h:column>

                    <h:column>
                        <f:facet name="header">Observaciones</f:facet>
                        #{venta.observaciones}
                    </h:column>

                    <h:column>
                        <h:commandButton value="Editar" action="#{ventasBean.prepararEdicion(venta)}" />
                    </h:column>

                    <h:column>
                        <h:commandButton value="Eliminar" action="#{ventasBean.eliminarVenta(venta.idVen)}" />
                    </h:column>
                </h:dataTable>
            </h:form>

            
            <h:form>
                <h:commandButton value="Nueva Venta" styleClass="btn btn-primary mt-3" action="nuevaVenta.xhtml?faces-redirect=true" />
            </h:form>
            <h:form>
    <h:commandButton value="Gestionar Clientes" action="/views/Clientes/Index.xhtml?faces-redirect=true" styleClass="btn btn-info" />
</h:form>
        </div>
    </div>
      </div>
    </div>

</h:body>
</html>
