<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets">
<h:head>
    <title>Migración de Clientes</title>
</h:head>
<h:body>
    <ui:include src="/views/Navbar.xhtml" />
    <p:growl id="msj" showDetail="true" showSummary="true" />

    <div class="container mt-5">
        <div class="card shadow p-4">
            <h2>Migración de Clientes</h2>
            <h4>Carga de archivos desde Excel</h4>
            <h:form id="formUpload" enctype="multipart/form-data">
                <p:outputLabel value="Seleccione el archivo" />
                <br/>
                <h:inputFile value="#{clientesBean.excel}" style="font-size: 20px"
                             required="true" requiredMessage="Debe seleccionar un archivo" />
                <br/><br/>
                <p:commandButton value="Cargar Clientes" ajax="false"
                                 actionListener="#{clientesBean.migrar}" />
            </h:form>
            <hr/>
            <center>
                <h:form>
                    <br/><br/>
                    <p:commandButton value="Volver al menú" ajax="false" immediate="true"
                                     action="/views/Clientes/Index.xhtml" />
                </h:form>
            </center>
        </div>
    </div>
</h:body>
</html>
