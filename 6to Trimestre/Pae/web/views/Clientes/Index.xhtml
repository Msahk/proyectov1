<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets">

<h:head>
    <title>Gestión de Clientes</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" />
</h:head>
<h:body class="bg-light">
    <ui:include src="/views/Navbar.xhtml" />

    <div class="container mt-5">
        <div class="card shadow p-4">
            <h2 class="text-center">Gestión de Clientes</h2>
            <hr/>
            <h:form>
                <div class="row mb-3">
                    <div class="col-md-6">
                        <h:outputLabel value="Buscar por nombre:" />
                        <h:inputText value="#{clientesBean.filtroNombre}" styleClass="form-control" />
                    </div>
                    <div class="col-md-6 d-flex align-items-end">
                        <h:commandButton value="Filtrar" action="#{clientesBean.filtrarClientes}" styleClass="btn btn-primary ms-2" />
                        <h:commandButton value="Nuevo Cliente" action="#{clientesBean.prepararNuevoCliente}" styleClass="btn btn-success ms-2" />
                    </div>
                </div>
                <h:dataTable value="#{clientesBean.listaClientes}" var="c" border="1" cellpadding="5" class="table table-bordered">
                    <h:column>
                        <f:facet name="header">ID</f:facet>
                        #{c.id_Cliente}
                    </h:column>
                    <h:column>
                        <f:facet name="header">Nombre</f:facet>
                        #{c.nombre}
                    </h:column>
                    <h:column>
                        <f:facet name="header">Teléfono</f:facet>
                        #{c.telefono}
                    </h:column>
                    <h:column>
                        <f:facet name="header">Correo</f:facet>
                        #{c.correo}
                    </h:column>
                    <h:column>
                        <f:facet name="header">Opciones</f:facet>
                        <h:commandButton value="Editar" action="#{clientesBean.prepararEdicion(c)}"  />
                        <h:commandButton value="Eliminar" action="#{clientesBean.eliminarCliente(c.id_Cliente)}"
                                         
                                         onclick="return confirm('¿Seguro que quieres eliminar este cliente?');" />
                    </h:column>
                </h:dataTable>
            </h:form>
        </div>
    </div>
</h:body>
</html>
