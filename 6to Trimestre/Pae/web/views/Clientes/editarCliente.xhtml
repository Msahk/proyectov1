<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets">

<h:head>
    <title>Editar Cliente</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" />
</h:head>
<h:body class="bg-light">
    <ui:include src="/views/Navbar.xhtml" />

    <div class="container mt-5">
        <div class="card shadow p-4">
            <h2 class="text-center">Editar Cliente</h2>
            <hr/>
            <h:form>
                <h:panelGrid columns="2" cellpadding="8" class="table table-borderless">
                    <h:outputLabel value="Nombre:" />
                    <h:inputText value="#{clientesBean.clienteSeleccionado.nombre}" styleClass="form-control" required="true" />

                    <h:outputLabel value="Teléfono:" />
                    <h:inputText value="#{clientesBean.clienteSeleccionado.telefono}" styleClass="form-control" />

                    <h:outputLabel value="Correo:" />
                    <h:inputText value="#{clientesBean.clienteSeleccionado.correo}" styleClass="form-control" />
                </h:panelGrid>
                <div class="mt-4 text-center">
                    <h:commandButton value="Actualizar" action="#{clientesBean.actualizarCliente}"  />
                    <h:commandButton value="Volver" action="/views/Clientes/Index.xhtml?faces-redirect=true"  immediate="true" />
                </div>
            </h:form>
        </div>
    </div>
</h:body>
</html>
