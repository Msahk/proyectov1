<?xml version='1.0' encoding='UTF-8' ?>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets">
<h:head>
    <title>Enviar Correos a Clientes</title>
</h:head>
<h:body>
    <ui:include src="/views/Navbar.xhtml" />
    <h:form>
        <f:event type="preRenderView" listener="#{correoClientesBean.listarClientes}" />
        <h:panelGrid columns="1">
            <p:outputLabel value="Destinatarios" />
            <p:selectManyMenu value="#{correoClientesBean.dest}" required="true" requiredMessage="Debe especificar Destinatarios"
                              widgetVar="destClientes" showCheckbox="true" style="width: 370px;">
                <f:selectItems value="#{correoClientesBean.listaClientes}" var="cli"
                               itemLabel="#{cli.nombre} - #{cli.correo}" itemValue="#{cli.correo}" />
            </p:selectManyMenu>
            <h:panelGrid columns="2">
                <p:commandButton value="Todos" onclick="PF('destClientes').selectAll()" />
                <p:commandButton value="Ninguno" onclick="PF('destClientes').unselectAll()" />
            </h:panelGrid>
            <p:outputLabel value="Asunto" />
            <p:inputText value="#{correoClientesBean.asunto}" required="true" size="35" requiredMessage="Debe especificar un Asunto"/>
            <p:outputLabel value="Mensaje" />
            <p:inputTextarea value="#{correoClientesBean.contenido}" required="true" cols="35" rows="5" requiredMessage="Debe especificar un Mensaje"/>
            <h:panelGrid columns="2">
                <p:commandButton value="Enviar" ajax="false" actionListener="#{correoClientesBean.enviarCorreo}" />
                <p:commandButton value="Cancelar" ajax="false" immediate="true" action="/views/Clientes/Index.xhtml" />
            </h:panelGrid>
        </h:panelGrid>
    </h:form>
    <p:messages id="msj" showSummary="true" showDetail="false" />
</h:body>
</html>
