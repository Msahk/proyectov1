<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets">
    <h:head>
        <title>Gestión de Pedidos</title>
        <link rel="stylesheet" 
              href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" />
    </h:head>
    <h:body styleClass="body">

        <ui:include src="/views/Navbar.xhtml" />
        <f:event type="preRenderView" listener="#{pedidosBean.cargarPedidos()}"/>
        <center>
            <div class="container mt-5" style="max-width: 1600px">
                <div class="card shadow p-3">
                    <h1>Gestión de Pedidos</h1>


                    <h:form>
                        <h:commandButton value="Reporte PDF"  style="margin-left: 10px" styleClass="btn btn-primary" actionListener="#{pedidosBean.exportarPDF}"/>
                        <br/><br/>
                        <p:dataTable value="#{pedidosBean.listaPedidos}" var="pedido">
                            <p:column>
                                <f:facet name="header">ID Pedido</f:facet>
                                <p:outputLabel value="#{pedido.idPed}" />
                            </p:column>
                            <p:column>
                                <f:facet name="header">Venta</f:facet>
                                <p:outputLabel value="#{pedido.idVen}" />
                            </p:column>
                            <p:column>
                                <f:facet name="header">Cliente</f:facet>
                                <p:outputLabel value="#{pedido.nombreCliente}" />
                            </p:column>
                            <p:column>
                                <f:facet name="header">Fecha Entrega</f:facet>
                                <p:outputLabel value="#{pedido.fechaEntrega}" />
                            </p:column>
                            <p:column>
                                <f:facet name="header">Estado</f:facet>
                                <p:outputLabel value="#{pedido.estado}" />
                            </p:column>
                            <p:column>
                                <f:facet name="header">Observaciones</f:facet>
                                <p:outputLabel value="#{pedido.observacionesPedido}" />
                            </p:column>
                            <p:column>
                                <f:facet name="header">Opciones</f:facet>
                                <h:commandLink action="editarPedido"
                                               styleClass="btn btn-outline-success d-inline-flex align-items-center"
                                               actionListener="#{pedidosBean.prepararEdicion(pedido)}" >
                                    <i class="bi bi-pencil" aria-hidden="true"></i>
                                </h:commandLink>

                                <h:commandLink

                                    actionListener="#{pedidosBean.eliminarPedido(pedido.idPed)}"
                                    onclick="return confirm('¿Está segur@ de ELIMINAR el pedido?')" 
                                    styleClass="btn btn-outline-danger d-inline-flex align-items-center">
                                    <i class="bi bi-trash" aria-hidden="true"></i>
                                </h:commandLink>

                            </p:column>
                        </p:dataTable>
                        <br/>
                        <p:commandButton 
                            value="Menu anterior" icon="pi pi-home" action="/views/Dashboard.xhtml?faces-redirect=true" />
                    </h:form>
                </div>
            </div>
        </center>
    </h:body>
</html>
