<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>El vecino</title>
    
    <link rel="stylesheet" href="assets/css/style.css">
     <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0"
    />
</head>
<body>
    <div class="login">
        <h2>Crea una cuenta</h2>
        <h3>Ten en cuenta ingresar bien los datos!</h3>
        <form class="form">
            <div class="caja">
                <input type="text" name="email" id="">
                <label for="email">Correo</label>
            </div>
            <div class="caja">
                <input type="password" name="password" id="password">
                <label for="password">Contraseña</label>
            </div>
            <div class="check-results">
                <span id="mayuscula" class="invalid"><i class="fa-solid fa-shield"></i>Letra mayuscula</span>
                <span id="minuscula" class="invalid"><i class="fa-solid fa-shield"></i>Letra minuscula</span>
                <span id="numero" class="invalid"><i class="fa-solid fa-shield"></i>Tener un numero</span>
                <span id="simbolo" class="invalid"><i class="fa-solid fa-shield"></i>Tener un simbolo</span>
            </div>
            <button type="submit">
                <p>Iniciar</p>
                <span class="material-symbols-outlined">arrow_forward</span>
            </button>
        </form>
        <a href="">¿Olvidaste la contraseña?</a>
        <p>¿No tienes cuenta? <a href="">Crea una cuenta</a></p>
    </div>


    <script src="assets/js/script.js"></script>
    <script src="https://kit.fontawesome.com/2b530c1d65.js" crossorigin="anonymous"></script>
</body>
</html>
