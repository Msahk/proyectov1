<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets">

<h:head>
    <title>Gestión de Producciones</title>
    <h:outputStylesheet library="css" name="bootstrap.min.css"/>
</h:head>

<h:body styleClass="body">
    <ui:include src="/views/Navbar.xhtml" />

    <p:growl id="msj" showDetail="true" showSummary="true" life="8000" />

    <f:event type="preRenderView" listener="#{produccionBean.listar}" />

    <center>
        <div class="container mt-5" style="max-width: 1600px">
            <div class="card shadow p-3">
                <h1 class="mb-4">Gestión de Producciones</h1>

                <!-- BOTONES SUPERIORES -->
                <h:form id="formBotones">
                    <div class="d-flex justify-content-center mb-4" style="gap: 10px;">
                        <p:commandButton value="Nueva Producción"
                                         icon="pi pi-plus"
                                         styleClass="btn btn-primary"
                                         ajax="false"
                                         action="nuevaproduccion?faces-redirect=true"/>

                        <p:commandButton value="Exportar Excel"
                                         icon="pi pi-file-excel"
                                         styleClass="btn btn-success"
                                         actionListener="#{produccionBean.exportarExcel}" />

                        <p:commandButton value="Generar PDF"
                                         icon="pi pi-file-pdf"
                                         styleClass="btn btn-danger"
                                         actionListener="#{produccionBean.generarReportePDF}" />
                    </div>
                </h:form>

                <!-- TABLA DE PRODUCCIONES -->
                <h:form id="formTablaProducciones">
                    <p:dataTable id="tablaProducciones"
                                 value="#{produccionBean.lstProduccion}" var="prod"
                                 class="table table-bordered" widgetVar="wtProduccion"
                                 rows="10" paginator="true"
                                 filteredValue="#{produccionBean.lstProduccionFiltrados}"
                                 emptyMessage="No se encontraron producciones"
                                 paginatorTemplate="{CurrentPageReport} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}"
                                 currentPageReportTemplate="{startRecord}-{endRecord} de {totalRecords} registros"
                                 rowsPerPageTemplate="10,20,50" filterEvent="keyup">

                        <!-- FILTRO GLOBAL -->
                        <f:facet name="header">
                            <div class="d-flex justify-content-end mb-2">
                                <p:inputText id="globalFilter" onkeyup="PF('wtProduccion').filter()"
                                             style="width:12rem" placeholder="Buscar..." />
                            </div>
                        </f:facet>

                        <!-- COLUMNAS -->
                        <p:column filterBy="#{prod.id_proc}" sortBy="#{prod.id_proc}" width="60">
                            <f:facet name="header">ID</f:facet>
                            <p:outputLabel value="#{prod.id_proc}" />
                        </p:column>

                        <p:column filterBy="#{prod.fecha_hora}" sortBy="#{prod.fecha_hora}">
                            <f:facet name="header">Fecha Registro</f:facet>
                            <p:outputLabel value="#{prod.fecha_hora}">
                                <f:convertDateTime pattern="dd/MM/yyyy HH:mm:ss" />
                            </p:outputLabel>
                        </p:column>

                        <p:column filterBy="#{prod.nombreUsuario}" sortBy="#{prod.nombreUsuario}">
    <f:facet name="header">Asignado por:</f:facet>
    <p:outputLabel value="#{prod.nombreUsuario}" />
</p:column>
                        
                       <p:column filterBy="#{prod.nombreAsignado}" sortBy="#{prod.nombreAsignado}"
          rendered="#{sessionUser.rol eq 'A'}">
    <f:facet name="header">Asignado a:</f:facet>
    <p:outputLabel 
        value="#{empty prod.nombreAsignado ? 'Sin asignar' : prod.nombreAsignado.concat(' ').concat(prod.apellidoAsignado)}" />
</p:column>



                        <p:column filterBy="#{prod.estado}" sortBy="#{prod.estado}" width="130">
                            <f:facet name="header">Estado</f:facet>
                            <h:outputText value="#{prod.estado}"
                                style="font-weight:bold; color:
                                    #{prod.estado eq 'Pendiente' ? 'orange' :
                                      prod.estado eq 'Aceptada' ? 'blue' : 'green'};" />
                        </p:column>

                        <!-- OPCIONES -->
                        <p:column style="width:15rem;">
                            <f:facet name="header">Opciones</f:facet>
                            <div class="d-flex justify-content-center" style="gap:6px;">

                                <!-- 🔁 Cambiar estado -->
                                <h:panelGroup rendered="#{prod.estado eq 'Pendiente'}">
                                    <p:commandButton icon="pi pi-check"
                                                     title="Aceptar producción"
                                                     styleClass="btn btn-outline-primary btn-sm"
                                                     actionListener="#{produccionBean.cambiarEstadoCiclo(prod)}"
                                                     update="msj tablaProducciones"
                                                     process="@this"
                                                     onclick="return confirm('¿Desea aceptar esta producción?');" />
                                </h:panelGroup>

                                <h:panelGroup rendered="#{prod.estado eq 'Aceptada'}">
                                    <p:commandButton icon="pi pi-flag"
                                                     title="Finalizar producción"
                                                     styleClass="btn btn-outline-success btn-sm"
                                                     actionListener="#{produccionBean.cambiarEstadoCiclo(prod)}"
                                                     update="msj tablaProducciones"
                                                     process="@this"
                                                     onclick="return confirm('¿Desea marcar esta producción como finalizada?');" />
                                </h:panelGroup>

                                <!-- ⏰ Ver Fechas -->
                                <p:commandButton icon="pi pi-clock"
                                                 title="Ver trazabilidad de fechas"
                                                 styleClass="btn btn-outline-warning btn-sm"
                                                 update=":dialogFechas"
                                                 oncomplete="PF('dlgFechas').show()">
                                    <f:setPropertyActionListener target="#{produccionBean.produccionSeleccionada}" value="#{prod}" />
                                </p:commandButton>

                              <!-- 👁️ Ver Recetas -->
<p:commandButton icon="pi pi-eye"
                 
                 title="Ver recetas"
                 styleClass="btn btn-outline-info btn-sm"
                 action="#{produccionBean.verRecetas(prod)}"
                 ajax="false" />


                                <!-- 🗑️ Eliminar -->
                                <p:commandButton icon="pi pi-trash"
                                                 title="Eliminar producción"
                                                 styleClass="btn btn-outline-danger btn-sm"
                                                 onclick="return confirm('¿Está seguro de eliminar esta producción?');"
                                                 actionListener="#{produccionBean.eliminar(prod)}"
                                                 update="msj tablaProducciones" />
                            </div>
                        </p:column>

                    </p:dataTable>

                    <br/>
                    <p:commandButton value="Menú anterior" icon="pi pi-home" 
                                     styleClass="btn btn-secondary"
                                     action="/views/Dashboard.xhtml?faces-redirect=true" />
                </h:form>
            </div>
        </div>
    </center>

   <!-- 🕓 DIÁLOGO DE TRAZABILIDAD DE FECHAS -->
<p:dialog id="dialogFechas" widgetVar="dlgFechas" modal="true" 
          header="Trazabilidad de Producción"
          showEffect="fade" hideEffect="fade" closable="true" 
          resizable="false" width="600">

    <h:panelGrid columns="2" cellpadding="10" columnClasses="col1,col2" style="width:100%">
        <h:outputText value="📅 Fecha de creación:" style="font-weight:bold; width:200px;"/>
        <h:outputText value="#{produccionBean.produccionSeleccionada.fecha_hora}">
            <f:convertDateTime pattern="dd/MM/yyyy HH:mm:ss" />
        </h:outputText>

        <h:outputText value="✅ Fecha de aceptación:" style="font-weight:bold; width:200px;"/>
        <h:outputText value="#{produccionBean.produccionSeleccionada.fecha_aceptacion != null ? 
                              produccionBean.produccionSeleccionada.fecha_aceptacion : 'Pendiente'}"
                      style="color:#{produccionBean.produccionSeleccionada.fecha_aceptacion != null ? 'black':'gray'}">
            <f:convertDateTime pattern="dd/MM/yyyy HH:mm:ss" />
        </h:outputText>

        <h:outputText value="🏁 Fecha de finalización:" style="font-weight:bold; width:200px;"/>
        <h:outputText value="#{produccionBean.produccionSeleccionada.fecha_finalizacion != null ? 
                              produccionBean.produccionSeleccionada.fecha_finalizacion : 'Pendiente'}"
                      style="color:#{produccionBean.produccionSeleccionada.fecha_finalizacion != null ? 'black':'gray'}">
            <f:convertDateTime pattern="dd/MM/yyyy HH:mm:ss" />
        </h:outputText>
    </h:panelGrid>

    <f:facet name="footer">
        <p:commandButton value="Cerrar" icon="pi pi-times" 
                         onclick="PF('dlgFechas').hide()" 
                         styleClass="btn btn-secondary" />
    </f:facet>
</p:dialog>


</h:body>
</html>
