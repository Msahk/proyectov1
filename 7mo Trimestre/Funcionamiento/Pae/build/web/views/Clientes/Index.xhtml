<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets">

<h:head>
    <title>Gestión de Clientes</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" />
</h:head>

<h:body styleClass="body">
    <f:event type="preRenderView" listener="#{clientesBean.listar()}" />
    <ui:include src="/views/Navbar.xhtml" />

    <center>
        <div class="container mt-5" style="max-width: 1600px">
            <div class="card shadow p-3">
                <h1>Gestión de Clientes</h1>

                <h:form id="formClientes">
                    <!-- Botones principales -->
                    <h:commandButton value="Reporte PDF" 
                                     styleClass="btn btn-primary"
                                     style="margin-left: 10px"
                                     actionListener="#{clientesBean.exportarPDF}"/>
                    
                    <h:commandButton value="Enviar Correos" 
                                     action="/views/Clientes/correo.xhtml?faces-redirect=true"
                                     styleClass="btn btn-primary"
                                     style="margin-left: 10px"/>

                    <h:commandButton value="Nuevo Cliente"
                                     action="nuevoCliente.xhtml?faces-redirect=true"
                                     styleClass="btn btn-primary"
                                     style="margin-left: 10px"/>
                    
                     <h:commandButton value="Gestionar Ventas"
                                         styleClass="btn btn-primary"
                                         action="/views/Ventas/index.xhtml?faces-redirect=true"
                                         style="margin-left: 10px"/>
                     

                    <h:commandButton value="Migrar"
                                     action="/views/Clientes/migrarClientes.xhtml?faces-redirect=true"
                                     styleClass="btn btn-primary"
                                     style="margin-left: 10px"/>

                    <br/><br/>

                    <!-- Tabla de clientes -->
                    <div style="overflow-x:auto; width:100%;">
                        <p:dataTable id="tablaClientes"
                                     value="#{clientesBean.listaClientes}"
                                     var="cli"
                                     paginator="true"
                                     rows="10"
                                     rowsPerPageTemplate="5,10,20,50"
                                     widgetVar="wtClientes"
                                     filteredValue="#{clientesBean.listaClientesFiltrados}"
                                     filterEvent="keyup"
                                     styleClass="table table-hover text-center">

                            <f:facet name="header">
                                <div align="right">
                                    <p:inputText id="globalFilter"
                                                 onkeyup="PF('wtClientes').filter()"
                                                 style="width:10rem"
                                                 placeholder="Buscar ..." />
                                </div>
                            </f:facet>

                            <!-- Columnas de datos -->
                            <p:column filterBy="#{cli.id_Cliente}" filterMatchMode="contains" sortBy="#{cli.id_Cliente}">
                                <f:facet name="header">ID</f:facet>
                                <h:outputText value="#{cli.id_Cliente}" />
                            </p:column>

                            <p:column filterBy="#{cli.nit}" filterMatchMode="contains" sortBy="#{cli.nit}">
                                <f:facet name="header">NIT</f:facet>
                                <h:outputText value="#{cli.nit}" />
                            </p:column>

                            <p:column filterBy="#{cli.nombre}" filterMatchMode="contains" sortBy="#{cli.nombre}">
                                <f:facet name="header">Nombre</f:facet>
                                <h:outputText value="#{cli.nombre}" />
                            </p:column>

                            <p:column filterBy="#{cli.telefono}" filterMatchMode="contains" sortBy="#{cli.telefono}">
                                <f:facet name="header">Teléfono</f:facet>
                                <h:outputText value="#{cli.telefono}" />
                            </p:column>

                            <p:column filterBy="#{cli.correo}" filterMatchMode="contains" sortBy="#{cli.correo}">
                                <f:facet name="header">Correo</f:facet>
                                <h:outputText value="#{cli.correo}" />
                            </p:column>

                            <!-- Columna de acciones -->
                            <p:column style="width:150px;">
                                <f:facet name="header">Acciones</f:facet>

                                <!-- Editar -->
                                <p:commandButton icon="pi pi-pencil"
                                                 title="Editar"
                                                 styleClass="btn btn-warning btn-sm me-2"
                                                 action="#{clientesBean.prepararEdicion(cli)}"
                                                 update="@form"
                                                 process="@this" />

                                <!-- Eliminar -->
                                <p:commandButton icon="pi pi-trash"
                                                 title="Eliminar"
                                                 styleClass="btn btn-danger btn-sm"
                                                 action="#{clientesBean.eliminarClienteSeleccionado}"
                                                 update="tablaClientes"
                                                 process="@this"
                                                 onclick="return confirm('¿Está seguro que desea eliminar este cliente?');">
                                    <f:setPropertyActionListener target="#{clientesBean.clienteSeleccionadoParaEliminar}" value="#{cli}" />
                                </p:commandButton>
                            </p:column>

                        </p:dataTable>
                    </div>

                    <br/>
                    <p:commandButton value="Menú anterior"
                                     icon="pi pi-home"
                                     action="/views/Dashboard.xhtml?faces-redirect=true"
                                     styleClass="btn btn-secondary" />
                </h:form>
            </div>
        </div>
    </center>
</h:body>
</html>
