<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets">

<h:head>
    <title>Editar Cliente</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" />
</h:head>

<h:body class="bg-light">
    <!-- Barra de navegación -->
    <ui:include src="/views/Navbar.xhtml" />

    <div class="container mt-5">
        <div class="card shadow p-4">
            <h2 class="text-center">Editar Cliente</h2>
            <hr/>
            
            <h:form id="formEditarCliente">
                <h:panelGrid columns="2" cellpadding="8" class="table table-borderless">

                    <!-- Nombre -->
                    <h:outputLabel value="Nombre:" for="nombre"/>
                    <h:inputText id="nombre" 
                                 value="#{clientesBean.clienteSeleccionado.nombre}" 
                                 styleClass="form-control" 
                                 required="true"
                                 requiredMessage="El nombre es obligatorio" />

                    <!-- NIT -->
                    <h:outputLabel value="NIT:" for="nit"/>
                    <h:inputText id="nit" 
                                 value="#{clientesBean.clienteSeleccionado.nit}" 
                                 styleClass="form-control" 
                                 required="true"
                                 requiredMessage="El NIT es obligatorio" />

                    <!-- Teléfono -->
                    <h:outputLabel value="Teléfono:" for="telefono"/>
                    <h:inputText id="telefono" 
                                 value="#{clientesBean.clienteSeleccionado.telefono}" 
                                 styleClass="form-control" />

                    <!-- Correo -->
                    <h:outputLabel value="Correo:" for="correo"/>
                    <h:inputText id="correo" 
                                 value="#{clientesBean.clienteSeleccionado.correo}" 
                                 styleClass="form-control" 
                                 validatorMessage="Correo inválido" />

                </h:panelGrid>

                <!-- Botones -->
                <div class="mt-4 text-center">
                    <h:commandButton value="Actualizar" 
                                     action="#{clientesBean.actualizarCliente}" 
                                     styleClass="btn btn-success" />
                    <h:commandButton value="Volver" 
                                     action="/views/Clientes/Index.xhtml?faces-redirect=true"  
                                     immediate="true" 
                                     styleClass="btn btn-secondary ms-2" />
                </div>
            </h:form>
        </div>
    </div>
</h:body>
</html>
