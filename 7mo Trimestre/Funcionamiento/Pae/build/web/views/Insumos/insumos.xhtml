<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets">

<h:head>
    <title>Gestión de Insumos</title>
    <h:outputStylesheet library="css" name="bootstrap.min.css"/>
</h:head>

<h:body styleClass="body">
    <ui:include src="/views/Navbar.xhtml" />
    <f:event type="preRenderView" listener="#{insumosBean.listar}" />
    <p:growl id="msj" showDetail="true" showSummary="true" />

    <center>
        <div class="container mt-5" style="max-width: 1600px">
            <div class="card shadow p-4">
                <h1>Gestión de Insumos</h1>

                <h:form id="formInsumos">
                    <!-- Botones principales -->
                    <div class="mb-3">
                        <h:commandButton value="Nuevo Insumo" 
                                         action="nuevoinsumo"
                                         styleClass="btn btn-primary" />

                        <h:commandButton value="Reporte PDF"
                                         style="margin-left: 10px"
                                         styleClass="btn btn-danger"
                                         actionListener="#{insumosBean.exportarPDF}" />

                        <h:commandButton value="Migrar desde Excel"
                                         style="margin-left: 10px"
                                         styleClass="btn btn-success"
                                         action="migrar" />
                    </div>

                    <!-- Tabla de insumos -->
                    <p:dataTable id="tablaInsumos"
                                 value="#{insumosBean.lstInsumos}"
                                 var="i"
                                 widgetVar="wtInsumos"
                                 paginator="true"
                                 rows="5"
                                 paginatorPosition="bottom"
                                 filteredValue="#{insumosBean.lstFiltrados}"
                                 emptyMessage="No se encontraron registros de insumos"
                                 paginatorTemplate="{CurrentPageReport} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}"
                                 currentPageReportTemplate="{startRecord}-{endRecord} de {totalRecords} registros"
                                 rowsPerPageTemplate="5,10,{ShowAll|'Todos'}"
                                 filterEvent="keyup"
                                 styleClass="table table-hover table-striped">

                        <!-- Buscador global -->
                        <f:facet name="header">
                            <div align="right">
                                <p:inputText id="globalFilter" 
                                             onkeyup="PF('wtInsumos').filter()" 
                                             style="width:10rem"
                                             placeholder="Buscar..." />
                            </div>
                        </f:facet>

                        <!-- Columnas -->
                        <p:column filterBy="#{i.id_ins}" width="60" filterMatchMode="contains" sortBy="#{i.id_ins}">
                            <f:facet name="header">ID</f:facet>
                            <p:outputLabel value="#{i.id_ins}" />
                        </p:column>

                        <p:column filterBy="#{i.nombre}" filterMatchMode="contains" sortBy="#{i.nombre}">
                            <f:facet name="header">Nombre</f:facet>
                            <p:outputLabel value="#{i.nombre}" />
                        </p:column>

                        <p:column filterBy="#{i.stock_actual}" width="100" filterMatchMode="contains" sortBy="#{i.stock_actual}">
                            <f:facet name="header">Stock Actual</f:facet>
                            <p:outputLabel value="#{i.stock_actual}" />
                        </p:column>

                        <p:column filterBy="#{i.unidad_medida}" width="100" filterMatchMode="contains" sortBy="#{i.unidad_medida}">
                            <f:facet name="header">Unidad</f:facet>
                            <p:outputLabel value="#{i.unidad_medida}" />
                        </p:column>

                        <p:column filterBy="#{i.stock_min}" width="100" filterMatchMode="contains" sortBy="#{i.stock_min}">
                            <f:facet name="header">Stock Mínimo</f:facet>
                            <p:outputLabel value="#{i.stock_min}" />
                        </p:column>

                        <!-- Estado -->
                        <p:column filterBy="#{i.estado}" width="140" filterMatchMode="contains" sortBy="#{i.estado}">
                            <f:facet name="header">Estado</f:facet>
                            <p:outputLabel 
                                value="#{i.estado}" 
                                style="font-weight:bold;
                                       color:#{i.estado eq 'Activo' ? 'green' : 
                                              (i.estado eq 'Insumo vencido' ? 'red' : 
                                              (i.estado eq 'Stock insuficiente' ? 'orange' : 'black'))};" />
                        </p:column>

                        <!-- Opciones -->
                        <p:column style="width:10rem">
                            <f:facet name="header">Opciones</f:facet>

                            <!-- Editar -->
                            <h:commandLink actionListener="#{insumosBean.editar(i)}"
                                           action="editarinsumo"
                                           styleClass="btn btn-outline-success d-inline-flex align-items-center mx-1">
                                <i class="bi bi-pencil" aria-hidden="true"></i>
                            </h:commandLink>

                            <!-- Eliminar -->
                            <h:commandLink actionListener="#{insumosBean.eliminar(i)}"
                                           onclick="return confirm('¿Está seguro de eliminar este insumo?')"
                                           styleClass="btn btn-outline-danger d-inline-flex align-items-center mx-1">
                                <i class="bi bi-trash" aria-hidden="true"></i>
                            </h:commandLink>
                            
<h:link value="Lotes"
        outcome="detalle_insumo.xhtml"
        styleClass="btn btn-outline-primary d-inline-flex align-items-center mx-1">
    <f:param name="idInsumo" value="#{i.id_ins}" />
    <i class="bi bi-box-seam" aria-hidden="true"></i>
</h:link>




                        </p:column>
                    </p:dataTable>

                    <br/>
                    <p:commandButton value="Menú anterior" icon="pi pi-home"
                                     action="/views/Dashboard.xhtml?faces-redirect=true"
                                     styleClass="btn btn-secondary" />
                </h:form>
            </div>
        </div>
    </center>
</h:body>
</html>
