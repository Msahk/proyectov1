<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:p="http://primefaces.org/ui">
<h:head>
    <title>Editar Venta</title>
    <style>
        .form-label { font-weight: 500; }
        .card { max-width: 980px; margin: 0 auto; }
        .form-control-plaintext { padding-top: .375rem; padding-bottom: .375rem; }
        .header-title { margin-bottom: 1rem; }
    </style>
</h:head>
<h:body class="bg-light">

    <ui:include src="/views/Navbar.xhtml" />

    <div class="container mt-4">
        <div class="card shadow p-4">
            <h2 class="text-center header-title">Editar Venta</h2>

           
            <h:form id="formEditarVenta" class="needs-validation" novalidate="novalidate">
                <p:growl id="msg" showDetail="true" life="4000" />

                <h:panelGroup styleClass="mb-3">
                    <h:messages globalOnly="true" layout="table" styleClass="alert alert-warning" />
                </h:panelGroup>

                
                <div class="row mb-3 align-items-center">
                    <div class="col-md-3"><label class="form-label">Tipo:</label></div>
                    <div class="col-md-9">
                        <h:outputText value="#{ventasBean.ventaSeleccionada.tipo}" styleClass="form-control-plaintext" />
                    </div>
                </div>

               
                <div class="row mb-3 align-items-center">
                    <div class="col-md-3"><label class="form-label">Cliente:</label></div>
                    <div class="col-md-9">
                        <h:outputText value="#{ventasBean.ventaSeleccionada.nombreCliente}" styleClass="form-control-plaintext" />
                    </div>
                </div>

                
                <div class="row mb-3 align-items-center">
                    <div class="col-md-3"><label class="form-label">Usuario que vendió:</label></div>
                    <div class="col-md-9">
                        <h:outputText value="#{ventasBean.ventaSeleccionada.nombreUsuario}" styleClass="form-control-plaintext" />
                    </div>
                </div>

               
                <div class="row mb-3 align-items-center">
                    <div class="col-md-3"><label class="form-label">Empleado Producción (EP):</label></div>
                    <div class="col-md-9">
                        <h:outputText value="#{ventasBean.getNombreAsignado(ventasBean.ventaSeleccionada)}" styleClass="form-control-plaintext" />
                    </div>
                </div>

                
                <div class="row mb-3 align-items-center">
                    <div class="col-md-3"><label class="form-label">Fecha:</label></div>
                    <div class="col-md-9">
                        <h:outputText value="#{ventasBean.ventaSeleccionada.fecha}">
                            <f:convertDateTime pattern="yyyy-MM-dd HH:mm" />
                        </h:outputText>
                    </div>
                </div>

                
                <div class="row mb-3 align-items-center">
                    <div class="col-md-3"><label class="form-label">Total (precio):</label></div>
                    <div class="col-md-9">
                        <h:outputText value="#{ventasBean.ventaSeleccionada.total}">
                            <f:convertNumber type="currency" currencySymbol="$" />
                        </h:outputText>
                    </div>
                </div>

               
                <div class="row mb-3 align-items-center">
                    <div class="col-md-3"><label class="form-label">Estado:</label></div>
                    <div class="col-md-9">
                        <h:outputText value="#{ventasBean.ventaSeleccionada.estado}" styleClass="form-control-plaintext" />
                    </div>
                </div>

                
                <div class="row mb-3">
                    <div class="col-md-3"><label for="obs" class="form-label">Observaciones:</label></div>
                    <div class="col-md-9">
                        <h:inputTextarea id="obs" value="#{ventasBean.ventaSeleccionada.observaciones}" rows="4" cols="40" styleClass="form-control" />
                        <h:message for="obs" styleClass="text-danger" />
                    </div>
                </div>

                <div class="d-flex justify-content-center mt-4">
                    <h:commandButton value="Actualizar" styleClass="btn btn-primary me-3" action="#{ventasBean.actualizarVenta}">
                        <f:ajax execute="@form" render="@form :formEditarVenta:msg" />
                    </h:commandButton>
                    <h:commandButton value="Volver" styleClass="btn btn-secondary" action="#{ventasBean.volverALaLista}" immediate="true" />
                </div>

            </h:form>
            

        </div>
    </div>

</h:body>
</html>
