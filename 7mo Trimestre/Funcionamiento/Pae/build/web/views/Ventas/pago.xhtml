<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:p="http://primefaces.org/ui">
    <h:head>
        <title>Gestión de Pagos - Factura</title>
        <!-- Bootstrap CSS CDN -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
        <!-- PrimeIcons para iconos -->
        <link href="https://cdn.jsdelivr.net/npm/primeicons@6.0.1/primeicons.css" rel="stylesheet"/>
    </h:head>

    <h:body>
        <h:form id="formPagos">
            <f:metadata>
                <f:viewParam name="idVenta" value="#{pagoBean.idVenta}" />
                <f:event type="preRenderView" listener="#{pagoBean.cargarPagosPorId}" />
            </f:metadata>

            <div class="container my-5">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <h2 class="card-title text-center mb-4">Factura de Venta</h2>

                        <!-- Datos de la venta -->
                        <div class="row mb-4">
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-bold">ID Venta:</label>
                                <div class="border p-2 rounded bg-light">
                                    <h:outputText value="#{pagoBean.ventaSeleccionada.idVen}" />
                                </div>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-bold">Cliente:</label>
                                <div class="border p-2 rounded bg-light">
                                    <h:outputText value="#{pagoBean.ventaSeleccionada.nombreCliente}" />
                                </div>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-bold">Registrada por:</label>
                                <div class="border p-2 rounded bg-light">
                                    <h:outputText value="#{pagoBean.ventaSeleccionada.nombreUsuario} #{pagoBean.ventaSeleccionada.apellidoUsuario}" />
                                </div>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-bold">Asignado a:</label>
                                <div class="border p-2 rounded bg-light">
                                    <h:outputText value="#{pagoBean.ventaSeleccionada.nombreAsignado} #{pagoBean.ventaSeleccionada.apellidoAsignado}" />
                                </div>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-bold">Total a pagar:</label>
                                <div class="border p-2 rounded bg-light">
                                    <h:outputText value="#{pagoBean.ventaSeleccionada.total}">
                                        <f:convertNumber type="currency" currencySymbol="$" maxFractionDigits="0"/>
                                    </h:outputText>
                                </div>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-bold">Estado actual:</label>
                                <div class="border p-2 rounded bg-light text-success fw-bold">
                                    <h:outputText value="#{pagoBean.ventaSeleccionada.estado}" />
                                </div>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-bold">Total pagado:</label>
                                <div class="border p-2 rounded bg-light">
                                    <h:outputText id="totalPagadoOutput" value="#{pagoBean.totalPagado}">
                                        <f:convertNumber type="currency" currencySymbol="$" maxFractionDigits="0"/>
                                    </h:outputText>
                                </div>
                            </div>
                        </div>


                        <!-- Tabla de pagos realizados -->
                        <h4 class="mb-3">Historial de Pagos</h4>
                        <h:dataTable id="tablaPagos" value="#{pagoBean.listaPagos}" var="p" styleClass="table table-striped table-bordered">

                            <h:column>
                                <f:facet name="header">Fecha</f:facet>
                                <h:outputText value="#{p.fechaPago}">
                                    <f:convertDateTime pattern="dd/MM/yyyy HH:mm"/>
                                </h:outputText>
                            </h:column>
                            <h:column>
                                <f:facet name="header">Monto</f:facet>
                                <h:outputText value="#{p.monto}">
                                    <f:convertNumber type="currency" currencySymbol="$" maxFractionDigits="0"/>
                                </h:outputText>
                            </h:column>
                            <h:column>
                                <f:facet name="header">Tipo de Pago</f:facet>
                                <h:outputText value="#{p.tipoPago}" />
                            </h:column>
                            <h:column>
                                <f:facet name="header">Acción</f:facet>
                      
                                <!-- Botón de eliminar con confirmación automática -->
                                <p:commandButton icon="bi bi-trash-fill"
                                                 styleClass="btn btn-danger btn-sm"
                                                 title="Eliminar Pago"
                                                 actionListener="#{pagoBean.eliminarPagoAction}"
                                                 update=":formPagos:tablaPagos :formPagos:totalPagadoOutput"
                                                 process="@this"
                                                 onclick="return confirm('¿Está seguro de eliminar este pago?');">
                                    <f:setPropertyActionListener target="#{pagoBean.pagoSeleccionado}" value="#{p}"/>
                                </p:commandButton>


                                <!-- Diálogo global para todas las confirmaciones -->
                                <p:confirmDialog global="true" widgetVar="confirmDialog"/>


                            </h:column>
                        </h:dataTable>



                        <!-- Registro de nuevo pago -->
                        <div class="mt-5 p-3 bg-light rounded">
                            <h4 class="mb-3">Registrar nuevo pago</h4>
                            <div class="row g-3">
                                <div class="col-md-6">
                                    <label class="form-label">Monto:</label>
                                    <h:inputText id="monto" value="#{pagoBean.pagoNuevo.monto}" required="true" styleClass="form-control"/>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">Tipo de pago:</label>
                                    <h:selectOneMenu id="tipo" value="#{pagoBean.pagoNuevo.tipoPago}" required="true" styleClass="form-select">
                                        <f:selectItem itemLabel="Seleccione..." itemValue="" />
                                        <f:selectItem itemLabel="Abono" itemValue="abono" />
                                        <f:selectItem itemLabel="Pago total" itemValue="total" />
                                    </h:selectOneMenu>
                                </div>
                            </div>
                            <h:commandButton value="Registrar Pago" action="#{pagoBean.registrarPago}" styleClass="btn btn-success mt-3"/>
                        </div>


                        <div class="mb-3">
                            <h:link outcome="/views/Ventas/index" styleClass="btn btn-secondary">
                                <i class="bi bi-arrow-left"></i> Regresar
                            </h:link>
                        </div>    

                        <!-- Footer -->
                        <div class="text-end mt-4">
                            <strong>Fecha actual:</strong> <h:outputText value="#{pagoBean.fechaActual}" />
                        </div>

                        <!-- Mensajes globales -->
                        <h:messages globalOnly="true" styleClass="text-danger fw-bold mt-3"/>
                    </div>
                </div>
            </div>

            <!-- Bootstrap JS CDN -->
            <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
        </h:form>
    </h:body>
</html>
