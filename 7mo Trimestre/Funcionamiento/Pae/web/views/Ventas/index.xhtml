<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets">
<h:head>
    <title>Gestión de Ventas</title>
    <link rel="stylesheet" 
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" />
</h:head>

<h:body class="body">
    <f:event type="preRenderView" listener="#{ventasBean.cargarVentas()}" />
    <ui:include src="/views/Navbar.xhtml" />

    <center>
        <div class="container mt-5" style="max-width: 1600px">
            <div class="card shadow p-3">
                <h1>Gestión de Ventas</h1>

                <h:form id="filtroVentasForm">
                    
                    <div class="d-flex flex-wrap justify-content-center gap-2 mb-3">
                        <h:commandButton value="Reporte PDF"
                                         styleClass="btn btn-primary"
                                         actionListener="#{ventasBean.exportarPDF}" />
                        <h:commandButton value="Nueva Venta"
                                         styleClass="btn btn-primary"
                                         action="nuevaVenta.xhtml?faces-redirect=true" />
                        <h:commandButton value="Gestionar Clientes"
                                         styleClass="btn btn-primary"
                                         action="/views/Clientes/Index.xhtml?faces-redirect=true" />
                        <h:commandButton value="Migrar"
                                         styleClass="btn btn-primary"
                                         action="/views/Ventas/migrarVentas.xhtml?faces-redirect=true" />
                        
                    </div>

                    
                    <p:dataTable value="#{ventasBean.listaVentas}" var="venta"
                                 widgetVar="wtVentas"
                                 paginator="true" rows="5"
                                 paginatorPosition="bottom"
                                 filteredValue="#{ventasBean.listaVentasFiltradas}"
                                 emptyMessage="No se encontraron registros"
                                 filterEvent="keyup"
                                 paginatorTemplate="{CurrentPageReport} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}"
                                 currentPageReportTemplate="{startRecord}-{endRecord} de {totalRecords} registros"
                                 rowsPerPageTemplate="5,10,{ShowAll|'Todos'}">

                        <f:facet name="header">
                            <div align="right">
                                <p:inputText id="globalFilter" onkeyup="PF('wtVentas').filter()"
                                             style="width:10rem" placeholder="Buscar ..." />
                            </div>
                        </f:facet>

                        <p:column headerText="ID" sortBy="#{venta.idVen}" filterBy="#{venta.idVen}">
                            <h:outputText value="#{venta.idVen}" />
                        </p:column>

                        <p:column headerText="Tipo" sortBy="#{venta.tipo}" filterBy="#{venta.tipo}">
                            <h:outputText value="#{venta.tipo}" />
                        </p:column>

                        <p:column headerText="Cliente" sortBy="#{venta.nombreCliente}" filterBy="#{venta.nombreCliente}">
                            <h:outputText value="#{venta.nombreCliente}" />
                        </p:column>

                        <p:column headerText="Registrada por" sortBy="#{venta.nombreUsuario}" filterBy="#{venta.nombreUsuario}">
                            <h:outputText value="#{venta.nombreUsuario}" />
                        </p:column>

                       
                        <p:column headerText="Asignado a"
                                  filterBy="#{ventasBean.getNombreAsignado(venta)}"
                                  sortBy="#{ventasBean.getNombreAsignado(venta)}"
                                  filterMatchMode="contains">
                            <h:outputText value="#{ventasBean.getNombreAsignado(venta)}" />
                        </p:column>

                        <p:column headerText="Total" sortBy="#{venta.total}" filterBy="#{venta.total}">
                            <h:outputText value="#{venta.total}" />
                        </p:column>

                        <p:column headerText="Estado" sortBy="#{venta.estado}" filterBy="#{venta.estado}">
                            <h:outputText value="#{venta.estado}" />
                        </p:column>

                        <p:column headerText="Observaciones" sortBy="#{venta.observaciones}" filterBy="#{venta.observaciones}">
                            <h:outputText value="#{venta.observaciones}" />
                        </p:column>

                       
                       <p:column headerText="Opciones" style="width: 220px; text-align: center;">
    <div class="d-flex justify-content-center gap-2">
        <h:commandLink action="editarVentas"
                       actionListener="#{ventasBean.prepararEdicion(venta)}"
                       styleClass="btn btn-outline-warning btn-sm"
                       title="Editar">
            <i class="bi bi-pencil"></i>
        </h:commandLink>

        <h:commandLink onclick="return confirm('¿Está seguro de eliminar la venta?')"
                       actionListener="#{ventasBean.eliminarVenta(venta.idVen)}"
                       styleClass="btn btn-outline-danger btn-sm"
                       title="Eliminar">
            <i class="bi bi-trash"></i>
        </h:commandLink>

        <h:link outcome="/views/Ventas/gestionarrecetas.xhtml"
                styleClass="btn btn-outline-primary btn-sm"
                title="Ver detalle">
            <f:param name="idVenta" value="#{venta.idVen}" />
            <i class="bi bi-eye"></i>
        </h:link>

        <h:link outcome="/views/Ventas/pago.xhtml?faces-redirect=true"
                styleClass="btn btn-outline-success btn-sm"
                title="Gestionar pagos">
            <f:param name="idVenta" value="#{venta.idVen}" />
            <i class="bi bi-receipt"></i>
        </h:link>
    </div>
</p:column>
                    </p:dataTable>
                </h:form>

                <br/>
                <h:form>
                    <p:commandButton value="Menú anterior"
                                     icon="pi pi-home"
                                     action="/views/Dashboard.xhtml?faces-redirect=true"
                                     styleClass="btn btn-secondary" />
                </h:form>
            </div>
        </div>
    </center>
</h:body>
</html>
