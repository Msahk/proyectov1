<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets">

    <h:head>
        <title>Gestionar Recetas de Venta</title>
    </h:head>

    <h:body>
        <ui:include src="/views/Navbar.xhtml" />

        <p:growl id="msj" showDetail="true" showSummary="true" />

        <!-- Capturar id de venta desde la URL -->
        <f:metadata>
            <f:viewParam name="idVenta" value="#{venta_recetasBean.idVentaSeleccionada}" />
            <f:viewAction action="#{venta_recetasBean.listar}" />
        </f:metadata>

        <section class="home">
            <div class="contenedor">
                <div class="tabla">
                    <section class="card">
                        <h:form>
                            <div class="encabezado">
                                <h2><i class='bx  bx-bar-chart-big'></i> Recetas de la Venta ##{venta_recetasBean.idVentaSeleccionada}</h2>
                                <div>
                                    <p:selectOneMenu value="#{venta_recetasBean.ventaReceta.idReceta}" 
                                                     styleClass="form-control" filter="true" filterMatchMode="contains" requiredMessage="Seleccione una receta">
                                        <f:selectItem itemLabel="-- Seleccione Receta --" itemValue="#{null}" />
                                        <f:selectItems value="#{ventasBean.listaRecetas}" var="r"
                                                       itemLabel="#{r.nombre}" itemValue="#{r.id_rec}" />
                                    </p:selectOneMenu>
                                    <p:inputText value="#{venta_recetasBean.ventaReceta.cantidad}" 
                                                 styleClass="form-control" placeholder="Cantidad" required="true" />

                                    <p:commandButton value="Agregar" icon="pi pi-plus"
                                                     action="#{venta_recetasBean.agregar}" 
                                                     styleClass="btn btn-primary w-100"/>
                                </div>
                            </div>
                            <h:panelGroup>
                                <div class="wrapper">
                                    <table>
                                        <thead>
                                            <tr>
                                                <th>Id <span class="draggable" onmousedown="initResize(0)"></span></th>
                                                <th>Receta <span class="draggable" onmousedown="initResize(1)"></span></th>
                                                <th>Cantidad <span class="draggable" onmousedown="initResize(2)"></span></th>
                                                <th>Precio Unitario <span class="draggable" onmousedown="initResize(3)"></span></th>
                                                <th>Subtotal <span class="draggable" onmousedown="initResize(4)"></span></th>
                                                <th style="width:5rem">Opciones</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            <ui:repeat value="#{venta_recetasBean.lstVentaRecetas}" var="vr">
                                                <tr>
                                                    <td><span class="cell-content"><h:outputText value="#{vr.idReceta}" /></span></td>
                                                    <td><span class="cell-content"><h:outputText value="#{vr.nombreReceta}" /></span></td>
                                                    <td><span class="cell-content"><h:outputText value="#{vr.cantidad}" /></span></td>
                                                    <td><span class="cell-content"><h:outputText value="#{vr.precio}" /></span></td>
                                                    <td><span class="cell-content"><h:outputText value="#{vr.subtotal}" /></span></td>
                                                    <td>
                                                        <h:commandLink
                                                                         title="Eliminar"
                                                                         action="#{venta_recetasBean.eliminar(vr)}"
                                                                         onclick="return confirm('¿Está seguro de eliminar esta receta de la venta?');"
                                                                         styleClass="btn btn-outline-danger"><i class="bi bi-trash" aria-hidden="true"></i></h:commandLink>
                                                    </td>
                                                </tr>
                                            </ui:repeat>
                                        </tbody>
                                    </table>
                                </div>
                            </h:panelGroup>
                            <h:commandLink styleClass="btn-back" action="/views/Ventas/index.xhtml"><i class='bx  bx-chevron-left'></i> Volver</h:commandLink>
                        
                        </h:form>
                    </section>
                </div>
            </div>
        </section>
    </h:body>
</html>
