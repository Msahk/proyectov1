<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets">

<h:head>
    <title>Gestión de Lotes</title>
    <h:outputStylesheet library="css" name="bootstrap.min.css"/>
</h:head>

<h:body styleClass="body">
    <ui:include src="/views/Navbar.xhtml" />
    <p:growl id="msj" showDetail="true" showSummary="true" />

    <center>
        <div class="container mt-5" style="max-width: 1200px">
            <div class="card shadow p-4">
                <h1>Gestión de Lotes</h1>

                <h:form id="formLotes">
                    <!-- Botones principales -->
                    <div class="mb-3 mt-3 d-flex justify-content-between">
                        <div>
                            <p:commandButton value="Agregar Lote"
                                             icon="pi pi-plus"
                                             styleClass="btn btn-primary"
                                             actionListener="#{detalleInsumoBean.prepararAgregar}"
                                             oncomplete="PF('dlgAgregarLote').show()"/>
                        </div>

                        <div>
                            <p:commandButton value="Ver Historial"
                                             icon="pi pi-history"
                                             styleClass="btn btn-info"
                                             actionListener="#{detalleInsumoBean.cargarHistorial(detalleInsumoBean.insumoSeleccionadoId)}"
                                             oncomplete="PF('dlgHistorial').show()"/>
                            
                            <p:commandButton value="Ver Eliminados"
                 icon="pi pi-eye-slash"
                 styleClass="btn btn-warning"
                 actionListener="#{detalleInsumoBean.cargarEliminados}"
                 oncomplete="PF('dlgEliminados').show()" />


                            
                            <p:commandButton value="Menú Anterior"
                                             icon="pi pi-home"
                                             action="/views/Insumos/insumos.xhtml?faces-redirect=true"
                                             styleClass="btn btn-secondary"
                                             style="margin-left: 10px;" />
                        </div>
                    </div>

                    <!-- Tabla de lotes activos -->
                    <p:dataTable id="tablaLotes"
                                 value="#{detalleInsumoBean.lstDetalle}"
                                 var="lote"
                                 widgetVar="wtLotes"
                                 paginator="true"
                                 rows="5"
                                 paginatorPosition="bottom"
                                 filteredValue="#{detalleInsumoBean.lstDetalleFiltrado}"
                                 emptyMessage="No se encontraron lotes"
                                 paginatorTemplate="{CurrentPageReport} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}"
                                 currentPageReportTemplate="{startRecord}-{endRecord} de {totalRecords} registros"
                                 rowsPerPageTemplate="5,10,{ShowAll|'Todos'}"
                                 filterEvent="keyup"
                                 styleClass="table table-hover table-striped">

                        <f:facet name="header">
                            <div align="right">
                                <p:inputText id="globalFilter" 
                                             onkeyup="PF('wtLotes').filter()" 
                                             style="width:12rem"
                                             placeholder="Buscar..." />
                            </div>
                        </f:facet>

                        <p:column filterBy="#{lote.id_detalle}" sortBy="#{lote.id_detalle}" width="60">
                            <f:facet name="header">ID</f:facet>
                            <h:outputText value="#{lote.id_detalle}" />
                        </p:column>

                        <p:column filterBy="#{lote.nombre_insumo}" sortBy="#{lote.nombre_insumo}">
                            <f:facet name="header">Insumo</f:facet>
                            <h:outputText value="#{lote.nombre_insumo}" />
                        </p:column>

                        <p:column filterBy="#{lote.cantidad}" sortBy="#{lote.cantidad}">
                            <f:facet name="header">Cantidad</f:facet>
                            <h:outputText value="#{lote.cantidad}" />
                        </p:column>

                        <p:column filterBy="#{lote.fecha_ingreso}" sortBy="#{lote.fecha_ingreso}">
                            <f:facet name="header">Fecha Ingreso</f:facet>
                            <h:outputText value="#{lote.fecha_ingreso}">
                                <f:convertDateTime pattern="dd/MM/yyyy HH:mm:ss" />
                            </h:outputText>
                        </p:column>

                        <p:column filterBy="#{lote.fecha_vencimiento}" sortBy="#{lote.fecha_vencimiento}">
                            <f:facet name="header">Fecha Vencimiento</f:facet>
                            <h:outputText value="#{lote.fecha_vencimiento}">
                                <f:convertDateTime pattern="dd/MM/yyyy" />
                            </h:outputText>
                        </p:column>

                        <p:column filterBy="#{lote.estado}" sortBy="#{lote.estado}">
                            <f:facet name="header">Estado</f:facet>
                            <h:outputText value="#{lote.estado}" 
                                          style="font-weight:bold; color:#{lote.estado eq 'Activo' ? 'green' : (lote.estado eq 'Vencido' ? 'red' : 'orange')};" />
                        </p:column>

                        <p:column style="width:12rem">
                            <f:facet name="header">Opciones</f:facet>

                            <!-- Editar lote -->
                            <p:commandButton icon="pi pi-pencil"
                 title="Editar"
                 actionListener="#{detalleInsumoBean.editar(lote)}"
                 update=":frmEditarLote" 
                 oncomplete="PF('dlgEditarLote').show()"
                 styleClass="btn btn-outline-success btn-sm" />


                          <p:commandButton icon="pi pi-trash"
                 title="Eliminar"
                 styleClass="btn btn-outline-danger btn-sm"
                 actionListener="#{detalleInsumoBean.prepararEliminar(lote)}"
                 oncomplete="PF('dlgEliminar').show()"
                 update=":formLotes:tablaLotes, :formEliminar:msgsEliminar" />

                        </p:column>

                    </p:dataTable>
                </h:form>

                <!-- Dialogo Historial -->
                <!-- Dialogo Historial con paginación -->
<p:dialog header="Historial del Insumo" widgetVar="dlgHistorial" modal="true" resizable="false"
          closable="true" width="700">
    <h:form id="formHistorial">
        <p:dataTable id="tablaHistorial"
                     value="#{detalleInsumoBean.lstHistorial}"
                     var="h"
                     paginator="true"
                     rows="5"
                     paginatorPosition="bottom"
                     currentPageReportTemplate="{startRecord}-{endRecord} de {totalRecords} registros"
                     paginatorTemplate="{CurrentPageReport} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink}"
                     rowsPerPageTemplate="5,10,20"
                     emptyMessage="No hay historial para este insumo"
                     styleClass="table table-hover table-striped">

            <p:column headerText="Fecha">
                <h:outputText value="#{h.fecha}">
                    <f:convertDateTime pattern="dd/MM/yyyy HH:mm:ss"/>
                </h:outputText>
            </p:column>

            <p:column headerText="Acción">
                <h:outputText value="#{h.accion}"/>
            </p:column>

            <p:column headerText="Novedad">
                <h:outputText value="#{h.novedad}"/>
            </p:column>
        </p:dataTable>
    </h:form>
</p:dialog>


                <!-- Dialogo Lotes Eliminados -->
                <p:dialog header="Lotes Eliminados" widgetVar="dlgEliminados" modal="true" resizable="false" closable="true" width="800">
                    <h:form id="formEliminados">
                        <p:dataTable id="tablaEliminados" value="#{detalleInsumoBean.lstLotesEliminados}" var="lote" 
                                     emptyMessage="No hay lotes eliminados"
                                     styleClass="table table-hover table-striped">

                            <p:column headerText="ID">
                                <h:outputText value="#{lote.id_detalle}" />
                            </p:column>
                            <p:column headerText="Insumo">
                                <h:outputText value="#{lote.nombre_insumo}" />
                            </p:column>
                            <p:column headerText="Cantidad">
                                <h:outputText value="#{lote.cantidad}" />
                            </p:column>
                            <p:column headerText="Fecha Eliminación">
                                <h:outputText value="#{lote.fecha_vencimiento}"/> <!-- Si guardas fecha de eliminación, cambiar aquí -->
                            </p:column>
                            <p:column headerText="Motivo">
                                <h:outputText value="#{lote.motivoEliminacion}" />
                            </p:column>
                        </p:dataTable>
                    </h:form>
                </p:dialog>

 <!-- Dialogo Agregar Lote -->
                <p:dialog header="Agregar Lote" widgetVar="dlgAgregarLote" modal="true" resizable="false" closable="true">
                    <h:form id="frmAgregarLote">
                        <p:messages id="msgsAgregar" showDetail="true" closable="true" />

                        <div class="form-group">
                            <label>Cantidad:</label>
                            <p:inputText id="cantidad" value="#{detalleInsumoBean.detalle.cantidad}" required="true" 
                                         label="Cantidad" styleClass="form-control" />
                        </div>

                        <div class="form-group">
                            <label>Fecha Vencimiento:</label>
                            <p:calendar id="fechaVencimiento" value="#{detalleInsumoBean.detalle.fecha_vencimiento}" 
                                        pattern="dd/MM/yyyy" required="true" 
                                        label="Fecha de Vencimiento" styleClass="form-control" />
                        </div>

                        <p:commandButton value="Agregar" 
                                         action="#{detalleInsumoBean.agregar}" 
                                         update=":formLotes:tablaLotes, frmAgregarLote:msgsAgregar"
                                         oncomplete="PF('dlgAgregarLote').hide()" 
                                         styleClass="btn btn-primary mt-2" />

                        <p:commandButton value="Cancelar" onclick="PF('dlgAgregarLote').hide()" type="button" 
                                         styleClass="btn btn-secondary mt-2"/>
                    </h:form>
                </p:dialog>

                <!-- Dialogo Editar Lote -->
                <p:dialog header="Editar Lote" widgetVar="dlgEditarLote" modal="true" resizable="false" closable="true">
                    <h:form id="frmEditarLote">
                        <div class="form-group">
                            <label>Cantidad:</label>
                            <p:inputText value="#{detalleInsumoBean.detalle.cantidad}" required="true" 
                                         styleClass="form-control" />
                        </div>
                        <div class="form-group">
                            <label>Fecha Vencimiento:</label>
                            <p:calendar value="#{detalleInsumoBean.detalle.fecha_vencimiento}" 
                                        pattern="dd/MM/yyyy" 
                                        styleClass="form-control" />
                        </div>
                        <div class="form-group">
                            <label>Estado:</label>
                            <p:selectOneMenu value="#{detalleInsumoBean.detalle.estado}" styleClass="form-control">
                                <f:selectItem itemLabel="Activo" itemValue="Activo" />
                                <f:selectItem itemLabel="Vencido" itemValue="Vencido" />
                                <f:selectItem itemLabel="Agotado" itemValue="Agotado" />
                            </p:selectOneMenu>
                        </div>
                        <p:commandButton value="Actualizar" actionListener="#{detalleInsumoBean.actualizar}" 
                                         update=":formLotes:tablaLotes" oncomplete="PF('dlgEditarLote').hide()" 
                                         styleClass="btn btn-success mt-2"/>
                        <p:commandButton value="Cancelar" onclick="PF('dlgEditarLote').hide()" type="button" 
                                         styleClass="btn btn-secondary mt-2"/>
                    </h:form>
                </p:dialog>

                <!-- Dialogo Eliminar Lote -->
                <p:dialog header="Eliminar Lote" widgetVar="dlgEliminar" modal="true" resizable="false" closable="true">
                    <h:form id="formEliminar">
                        <p:messages id="msgsEliminar" showDetail="true" closable="true"/>
                        <h:outputText value="Ingrese el motivo de eliminación:" />
                        <p:inputTextarea value="#{detalleInsumoBean.motivoEliminacion}" rows="4" cols="50" required="true" />
                        <br/>
                        <p:commandButton value="Eliminar" actionListener="#{detalleInsumoBean.eliminarConMotivo}" 
                                         update=":formLotes:tablaLotes, formEliminar:msgsEliminar"
                                         oncomplete="PF('dlgEliminar').hide()"
                                         styleClass="btn btn-danger mt-2"/>
                        <p:commandButton value="Cancelar" onclick="PF('dlgEliminar').hide()" type="button" 
                                         styleClass="btn btn-secondary mt-2"/>
                    </h:form>
                </p:dialog>

            </div>
        </div>
    </center>
</h:body>
</html>
