<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets">

<h:head>
    <title>Gestión de Recetas</title>
    <h:outputStylesheet library="css" name="bootstrap.min.css"/>
</h:head>

<h:body styleClass="body">
    <ui:include src="/views/Navbar.xhtml" />

    <f:event type="preRenderView" listener="#{recetasBean.listar}" />

    <p:growl id="msj" showDetail="true" showSummary="true" />

    <center>
        <div class="container mt-5" style="max-width: 1600px">
            <div class="card shadow p-3">
                <h1>Gestión de Recetas</h1>

                <!-- BOTONES SUPERIORES -->
                <h:form id="formBotones">
                    <p:commandButton value="Nueva Receta" icon="pi pi-plus"
                                     action="#{recetasBean.irANuevaReceta}" 
                                     styleClass="btn btn-primary" />
                    <p:commandButton value="Reporte PDF" icon="pi pi-file-pdf"
                                     actionListener="#{recetasBean.exportarPDF}" 
                                     update="@form" styleClass="btn btn-primary ml-2" />
                    <p:commandButton value="Migrar Excel" icon="pi pi-upload"
                                     action="/views/Recetas/migrar.xhtml?faces-redirect=true" 
                                     styleClass="btn btn-primary ml-2" />
                </h:form>

                <br/><br/>

                <!-- TABLA DE RECETAS -->
                <h:form id="formTablaRecetas">
                    <p:dataTable id="tablaRecetas"
                                 value="#{recetasBean.lstRecetas}" 
                                 var="r"
                                 class="table table-bordered"
                                 widgetVar="wtRecetas"
                                 emptyMessage="No se encontraron recetas"
                                 rows="5"
                                 paginator="true"
                                 paginatorPosition="bottom"
                                 filteredValue="#{recetasBean.lstFiltradas}"
                                 paginatorTemplate="{CurrentPageReport} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}"
                                 currentPageReportTemplate="{startRecord}-{endRecord} de {totalRecords} registros"
                                 rowsPerPageTemplate="5,10,{ShowAll|'Todos'}"
                                 filterEvent="keyup">

                        <f:facet name="header">
                            <div align="right">
                                <p:inputText id="globalFilter" onkeyup="PF('wtRecetas').filter()" 
                                             style="width:10rem" placeholder="Buscar..." />                            
                            </div>
                        </f:facet>

                        <p:column filterBy="#{r.id_rec}" width="60" filterMatchMode="contains" sortBy="#{r.id_rec}">
                            <f:facet name="header">ID</f:facet>
                            <p:outputLabel value="#{r.id_rec}" />
                        </p:column>

                        <p:column filterBy="#{r.nombre}" filterMatchMode="contains" sortBy="#{r.nombre}">
                            <f:facet name="header">Nombre</f:facet>
                            <p:outputLabel value="#{r.nombre}" />
                        </p:column>

                        <p:column filterBy="#{r.descripcion}" filterMatchMode="contains" sortBy="#{r.descripcion}">
                            <f:facet name="header">Descripción</f:facet>
                            <p:outputLabel value="#{r.descripcion}" />
                        </p:column>

                        <!-- 💲 NUEVA COLUMNA: PRECIO -->
                        <p:column filterBy="#{r.precio}" filterMatchMode="contains" sortBy="#{r.precio}" width="120">
                            <f:facet name="header">Precio</f:facet>
                            <p:outputLabel value="#{r.precio}">
                                <f:convertNumber type="currency" currencySymbol="$" maxFractionDigits="2" />
                            </p:outputLabel>
                        </p:column>

                        <p:column filterBy="#{r.estado}" width="110" filterMatchMode="contains" sortBy="#{r.estado}">
                            <f:facet name="header">Estado</f:facet>
                            <p:outputLabel value="#{r.estado eq 'Activo' ? 'Activo' : 'Inactivo'}"
                                           style="font-weight:bold; color:#{r.estado eq 'Activo' ? 'green' : 'red'};" />
                        </p:column>

                        <p:column style="width:15rem">
                            <f:facet name="header">Opciones</f:facet>

                            <div class="d-flex justify-content-start flex-wrap">
                                <!-- EDITAR -->
                                <p:commandButton action="#{recetasBean.irAEditar(r)}" icon="pi pi-pencil"
                                                 title="Editar"
                                                 styleClass="btn btn-sm btn-outline-success me-1" />

                                <!-- GESTIONAR -->
                                <p:commandButton icon="pi pi-box"
                                                 title="Gestionar Insumos"
                                                 action="#{recetasBean.irAGestionarInsumos(r)}"
                                                 styleClass="btn btn-sm btn-outline-primary me-1"
                                                 ajax="false" />

                                <!-- ELIMINAR -->
                                <p:commandButton actionListener="#{recetasBean.eliminar(r)}" icon="pi pi-trash"
                                                 title="Eliminar"
                                                 update="tablaRecetas" 
                                                 oncomplete="PF('wtRecetas').clearFilters()" 
                                                 onclick="return confirm('¿Está seguro de ELIMINAR esta receta?');"
                                                 styleClass="btn btn-sm btn-outline-danger" />
                            </div>
                        </p:column>

                    </p:dataTable>

                    <br/>
                    <p:commandButton value="Menú anterior" icon="pi pi-home" 
                                     action="/views/Dashboard.xhtml?faces-redirect=true" />
                </h:form>

            </div>
        </div>
    </center>
</h:body>
</html>
