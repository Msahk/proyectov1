<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" 
                      "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets">

<h:head>
    <title>Nueva Producción</title>
    <h:outputStylesheet library="css" name="bootstrap.min.css"/>
</h:head>

<h:body style="background-color:#f8f9fa;">
    <ui:include src="/views/Navbar.xhtml" />

    <!-- Limpia el formulario cada vez que se carga la vista -->
    <f:event type="preRenderView" listener="#{produccionBean.limpiar}" />

    <div class="container mt-5">
        <div class="card shadow p-4">
            <div class="card-header bg-primary text-white mb-4">
                <h2 class="text-center mb-0">Registrar Nueva Producción</h2>
            </div>

            <h:form id="formNuevaProduccion">
                <!-- Mensajes -->
                <p:growl id="msgs" showDetail="true" life="4000" />

                <!-- Información -->
                <div class="text-center mb-3">
                    <p class="text-muted">
                        La fecha y hora de producción se registrarán automáticamente.
                    </p>
                </div>

                <!-- Botones -->
                <div class="text-center mt-4">
                    <p:commandButton value="Guardar"
                                     action="#{produccionBean.guardar}"
                                     update="@form msgs"
                                     styleClass="btn btn-success mx-2"/>
                    
                    <p:commandButton value="Cancelar"
                                     ajax="false" immediate="true"
                                     action="/views/Produccion/nuevaproduccion.xhtml?faces-redirect=true"
                                     styleClass="btn btn-secondary mx-2"/>
                </div>
            </h:form>
        </div>
    </div>
</h:body>
</html>
