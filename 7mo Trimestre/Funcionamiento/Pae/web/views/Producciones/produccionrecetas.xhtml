<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets">

<h:head>
    <title>Recetas de la Producción</title>
    <h:outputStylesheet library="css" name="formularios.css"/>

    <style>
        /* Card principal */
        .card-form {
            max-width: 1200px;
            width: 95%;
            padding: 25px;
            margin: 20px auto;
            background-color: #fff;
            border-radius: 10px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            font-family: Arial, sans-serif;
        }
        th, td {
            padding: 10px 12px;
            border: 1px solid #ddd;
        }
        th {
            background-color: #f2f2f2;
            font-weight: 600;
            text-align: left;
        }

        /* Botones */
        .btn {
            padding: 6px 14px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 500;
        }
        .btn-primario {
            background-color: #007bff;
            color: white;
            border: none;
        }
        .btn-secundario {
            background-color: #6c757d;
            color: white;
            border: none;
        }
        
        body.dark th {
    background-color: #2a2a2a !important;
    color: #ffffff !important;
}

body.dark td {
    background-color: #1f1f1f !important;
    color: #e0e0e0 !important;
}

body.dark table,
body.dark th,
body.dark td {
    border-color: #444 !important;
}

body.dark .btn.btn-primario {
    background-color: transparent !important;
    color: #ffffff !important;
    border: 1px solid #0d6efd !important;
}

body.dark .btn.btn-primario:hover {
    background-color: rgba(255,255,255,0.1) !important;
}


    </style>
</h:head>

<h:body>
    <ui:include src="/views/Navbar.xhtml"/>
    <h:messages id="msj" globalOnly="true" styleClass="msg"/>

    <section class="home">
        <div class="card-form">

            <h2>
                Recetas Asociadas a la Producción
            </h2>

            <h:form id="formRecetasProduccion">

                <button type="button" class="btn btn-primario" onclick="history.back()">
    <i class="bi bi-arrow-left"></i> Volver
</button>

                <!-- TABLA -->
                <h:panelGroup id="tablaRecetasWrapper">
                    <table>
                        <thead>
                        <tr>
                            <th>ID Detalle</th>
                            <th>Receta</th>
                            <th>Cantidad</th>
                        </tr>
                        </thead>

                        <tbody>
                        <ui:repeat value="#{produccionrecetasBean.lstProduccionRecetas}" var="pr">
                            <tr>
                                <td>#{pr.id_detalle}</td>
                                <td>#{produccionrecetasBean.getNombreReceta(pr.id_rec)}</td>
                                <td>#{pr.cantidad}</td>
                            </tr>
                        </ui:repeat>
                        </tbody>

                    </table>
                </h:panelGroup>

            </h:form>

        </div>
    </section>

    <script type="text/javascript" src="/assets/js/tabla.js"></script>
</h:body>

</html>
