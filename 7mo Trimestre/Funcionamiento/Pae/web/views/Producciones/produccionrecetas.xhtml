<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
                      "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">

<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets">

<h:head>
    <title>Recetas de la Producción</title>
</h:head>

<h:body>
    <ui:include src="/views/Navbar.xhtml" />

    <section class="home">
        <div class="contenedor">
            <div class="tabla">
                <section class="card">
                    <h:form id="formRecetasProduccion">

                        <div class="encabezado">
                            <h2><i class="bx bx-baguette"></i> Recetas Asociadas a la Producción</h2>
                            <div>
                                <p:commandButton value="Volver a Producciones"
                 icon="pi pi-arrow-left"
                 ajax="false"
                 action="/views/Producciones/produccion?faces-redirect=true"
                 styleClass="export-btn"/>

                            </div>
                        </div>

                        <h:panelGroup id="tablaRecetasWrapper">
                            <div class="wrapper">
                                <table>
                                    <thead>
                                        <tr>
                                            <th>ID Detalle <span class="draggable" onmousedown="initResize(0)"></span></th>
                                            <th>Receta <span class="draggable" onmousedown="initResize(1)"></span></th>
                                            <th>Cantidad <span class="draggable" onmousedown="initResize(2)"></span></th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <ui:repeat value="#{produccionrecetasBean.lstProduccionRecetas}" var="pr">
                                            <tr>
                                                <td><span class="cell-content"><h:outputText value="#{pr.id_detalle}" /></span></td>
                                                <td><span class="cell-content"><h:outputText value="#{produccionrecetasBean.getNombreReceta(pr.id_rec)}" /></span></td>
                                                <td><span class="cell-content"><h:outputText value="#{pr.cantidad}" /></span></td>
                                            </tr>
                                        </ui:repeat>
                                    </tbody>
                                </table>
                            </div>
                        </h:panelGroup>

                        <h:commandLink styleClass="btn-back"
                                       action="/views/Producciones/produccion?faces-redirect=true">
                            <i class='bx bx-chevron-left'></i> Volver
                        </h:commandLink>

                    </h:form>
                </section>
            </div>
        </div>
    </section>

    <script type="text/javascript" src="/assets/js/tabla.js"></script>
</h:body>
</html>
